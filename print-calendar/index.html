<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="प्रिन्ट गर्न मिल्ने व्यक्तिगत मासिक पात्रो तयार गर्नुहोस्।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>प्रिन्ट पात्रो — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>प्रिन्ट पात्रो</h1><p>प्रिन्ट गर्न मिल्ने व्यक्तिगत मासिक पात्रो तयार गर्नुहोस्।</p></section><section class="card" style="margin-top:20px"><div class="grid"><div><label>महिना</label><input id="month" type="month"></div><div class="no-print"><button onclick="window.print()">🖨️ प्रिन्ट गर्नुहोस्</button></div></div><div id="cal"></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>month.value=new Date().toISOString().slice(0,7);function draw(){let [y,m]=month.value.split('-').map(Number);let days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay();let h='<h2>'+month.value+'</h2><div class="grid">';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++)h+='<div class="item"><b>'+d+'</b></div>';set('cal',h+'</div>')}month.onchange=draw;draw()</script></body></html>
