<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="पूजा वा धार्मिक कार्यका लागि व्यक्तिगत संकल्पको संरचना तयार गर्ने सहायक पृष्ठ।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>संकल्प — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>संकल्प</h1><p>पूजा वा धार्मिक कार्यका लागि व्यक्तिगत संकल्पको संरचना तयार गर्ने सहायक पृष्ठ।</p></section><section class="grid"><div class="card"><input id="person" placeholder="आफ्नो नाम"><input id="purpose" placeholder="संकल्पको उद्देश्य"><button onclick="make()">संकल्प तयार गर्नुहोस्</button></div><div class="card"><h2>तयार पाठ</h2><div id="out" class="result">विवरण भर्नुहोस्।</div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>function make(){let p=document.getElementById('person').value||'भक्त';let u=document.getElementById('purpose').value||'शुभ कार्य';set('out','म आज '+NP.fmt(new Date())+' का दिन, '+p+' भएर '+u+' को शुभ उद्देश्यले श्रद्धापूर्वक संकल्प गर्दछु।')}</script></body></html>
