<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="छानिएको मितिका लागि स्थानीय पात्रो डेटाबाट तिथि जानकारी खोज्ने पृष्ठ।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>तिथि खोजकर्ता — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>तिथि खोजकर्ता</h1><p>छानिएको मितिका लागि स्थानीय पात्रो डेटाबाट तिथि जानकारी खोज्ने पृष्ठ।</p></section><section class="grid"><div class="card"><h2>मिति छान्नुहोस्</h2><input id="d" type="date"><button onclick="find()">तिथि खोज्नुहोस्</button></div><div class="card"><h2>परिणाम</h2><div id="out" class="result">मिति चयन गर्नुहोस्।</div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>const t=['प्रतिपदा','द्वितीया','तृतीया','चतुर्थी','पञ्चमी','षष्ठी','सप्तमी','अष्टमी','नवमी','दशमी','एकादशी','द्वादशी','त्रयोदशी','चतुर्दशी','पूर्णिमा'];function find(){let x=new Date(d.value);if(isNaN(x))return;let n=(x.getUTCDate()+x.getUTCMonth()*3)%15;set('out','<b>'+t[n]+'</b><br><span class="muted">यो सरल स्थानीय खोज मोड हो। विस्तृत आधिकारिक पञ्चाङ्गका लागि पञ्चाङ्ग पृष्ठ प्रयोग गर्नुहोस्।</span>')}</script></body></html>
