<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="परम्परागत समयको आधुनिक डिजिटल प्रस्तुति।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>वैदिक घडी — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>वैदिक घडी</h1><p>परम्परागत समयको आधुनिक डिजिटल प्रस्तुति।</p></section><section class="card" style="margin-top:20px;text-align:center"><div id="clock" class="big">--:--:--</div><h2 id="period"></h2><p class="muted">नेपाल समय (Asia/Kathmandu)</p></section><section class="grid"><div class="card"><h3>घटी</h3><div id="ghati" class="result"></div></div><div class="card"><h3>पल</h3><div id="pal" class="result"></div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>function tick(){let now=new Date();let parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kathmandu',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(now);let o={};parts.forEach(x=>o[x.type]=x.value);let sec=+o.hour*3600 + +o.minute*60 + +o.second;set('clock',o.hour+':'+o.minute+':'+o.second);let g=sec/1440;set('ghati',g.toFixed(2)+' घटी');set('pal',((g%1)*60).toFixed(2)+' पल');set('period',+o.hour<12?'पूर्वाह्न':'अपराह्न')}tick();setInterval(tick,1000)</script></body></html>
