<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>3D Traffic Racer</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff;touch-action:none}#hud{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px 14px;background:#0009;border:1px solid #ffffff22;border-radius:16px;font-weight:800}#msg{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#020617cc}.panel{width:min(380px,90vw);padding:28px;text-align:center;background:#0f172af2;border:1px solid #ffffff22;border-radius:26px;box-shadow:0 25px 80px #0008}.panel h1{font-size:38px;margin:0 0 8px}.panel p{color:#cbd5e1;line-height:1.6}.btn{border:0;border-radius:14px;padding:13px 22px;background:#ef4444;color:white;font-weight:900;font-size:16px}.touch{position:fixed;z-index:6;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none}.touch button{pointer-events:auto;width:72px;height:58px;border:1px solid #fff3;border-radius:18px;background:#0008;color:#fff;font-size:28px}canvas{display:block}</style></head><body><div id="hud">🏁 <span id="score">0</span> km &nbsp; • &nbsp; ⭐ <span id="best">0</span></div><div id="msg"><div class="panel"><h1>🏎️ 3D Traffic Racer</h1><p>Drive through traffic, change lanes and survive as long as possible. Swipe or use ← →.</p><button class="btn" id="start">Start Race</button></div></div><div class="touch"><button id="left">←</button><button id="right">→</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd7ff);scene.fog=new THREE.Fog(0x9bd7ff,35,180);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);camera.position.set(0,5,9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x334155,1.7));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,5);scene.add(sun);function mat(c){return new THREE.MeshStandardMaterial({color:c})}const road=new THREE.Mesh(new THREE.PlaneGeometry(16,260),mat(0x20252b));road.rotation.x=-Math.PI/2;road.position.z=-110;scene.add(road);for(let x of[-2.67,2.67]){const line=new THREE.Mesh(new THREE.BoxGeometry(.12,.03,260),mat(0xffffff));line.position.set(x,.03,-110);scene.add(line)}for(let z=0;z>-250;z-=10){const d=new THREE.Mesh(new THREE.BoxGeometry(.14,.04,5),mat(0xffffff));d.position.set(0,.04,z);scene.add(d)}function car(c){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.7,.55,3.1),mat(c));b.position.y=.55;g.add(b);const top=new THREE.Mesh(new THREE.BoxGeometry(1.25,.45,1.55),mat(c));top.position.set(0,.98,-.15);g.add(top);const w=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.28,12),mat(0x111111));w.rotation.z=Math.PI/2;for(let x of[-.8,.8])for(let z of[-1.05,1.05]){let q=w.clone();q.position.set(x,.3,z);g.add(q)}return g}const player=car(0x22d3ee);player.position.z=5;scene.add(player);let lane=1,running=false,dist=0,last=0,traffic=[];const lanes=[-5.3,0,5.3];function spawn(){const c=car([0xef4444,0x22c55e,0xf59e0b,0x8b5cf6][Math.floor(Math.random()*4)]);c.position.set(lanes[Math.floor(Math.random()*3)],0,-120-Math.random()*40);scene.add(c);traffic.push(c)}function reset(){traffic.forEach(x=>scene.remove(x));traffic=[];lane=1;dist=0;player.position.x=0;running=true;document.getElementById('msg').style.display='none';last=performance.now()}function move(d){lane=Math.max(0,Math.min(2,lane+d))}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});['left','right'].forEach((id,i)=>document.getElementById(id).onclick=()=>move(i?1:-1));let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>35)move(d>0?1:-1)});document.getElementById('start').onclick=reset;let best=+localStorage.racerBest||0;document.getElementById('best').textContent=best;function crash(){running=false;best=Math.max(best,Math.floor(dist));localStorage.racerBest=best;document.getElementById('best').textContent=best;document.querySelector('#msg h1').textContent='💥 Crash!';document.querySelector('#msg p').textContent='Distance: '+Math.floor(dist)+' km. Try to beat your record.';document.getElementById('start').textContent='Race Again';document.getElementById('msg').style.display='grid'}function loop(t){requestAnimationFrame(loop);if(!running){renderer.render(scene,camera);return}let dt=Math.min(.04,(t-last)/1000);last=t;dist+=dt*18;player.position.x+=(lanes[lane]-player.position.x)*Math.min(1,dt*8);camera.position.x+=(player.position.x*.25-camera.position.x)*dt*4;let speed=24+Math.min(32,dist*.03);if(Math.random()<dt*.9)spawn();traffic.forEach((c,i)=>{c.position.z+=speed*dt;if(c.position.z>18){scene.remove(c);traffic.splice(i,1)}if(Math.abs(c.position.z-player.position.z)<2.3&&Math.abs(c.position.x-player.position.x)<1.7)crash()});document.getElementById('score').textContent=Math.floor(dist);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
