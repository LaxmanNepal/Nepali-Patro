<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b91c1c">
  <meta name="description" content="नेपाली पात्रोमा AI Chess खेल्नुहोस् — browser मै AI विरुद्ध chess खेल, responsive board, fullscreen र mobile touch support।">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://apps.laxmannepal.com.np/Nepali-Patro/games/AI-Chess/">
  <title>AI Chess — नेपाली पात्रो गेम्स</title>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"VideoGame","name":"AI Chess","description":"Play chess against a pure JavaScript AI inside Nepali Patro Games.","genre":["Chess","Strategy","Board Game"],"gamePlatform":"Web Browser","url":"https://apps.laxmannepal.com.np/Nepali-Patro/games/AI-Chess/"}
  </script>
  <style>
    :root{--red:#b91c1c;--red2:#dc2626;--ink:#101828;--muted:#667085;--line:#e4e7ec;--glass:rgba(255,255,255,.82)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fff7f7 0,#f8fafc 48%,#fff 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:12px 10px 26px}
    .page{width:min(1240px,100%);margin:auto}
    .hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 auto 10px;padding:14px 16px;border:1px solid rgba(185,28,28,.12);border-radius:22px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(16,24,40,.07)}
    .brand{min-width:0}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;color:var(--red)}
    h1{font-size:clamp(24px,5vw,36px);line-height:1;margin:4px 0 5px;letter-spacing:-.045em}.sub{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
    .actions{display:flex;align-items:center;gap:7px;flex-shrink:0}.btn{border:1px solid var(--line);background:#fff;color:#344054;text-decoration:none;cursor:pointer;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:900}.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 7px 18px rgba(185,28,28,.2)}
    .game{position:relative;overflow:hidden;border-radius:26px;background:#111;border:1px solid rgba(0,0,0,.08);box-shadow:0 22px 70px rgba(16,24,40,.16)}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#111827,#0b1020);color:#fff;font-size:13px;font-weight:800;z-index:0;transition:opacity .25s}.loading.hide{opacity:0;pointer-events:none}
    iframe{position:relative;z-index:1;display:block;width:100%;height:min(80vh,900px);min-height:620px;border:0;background:#111}
    .footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.75);color:var(--muted);font-size:11px;line-height:1.45}.footer a{color:var(--red);font-weight:900;text-decoration:none}
    @media(max-width:700px){body{padding:7px 7px 18px}.hero{padding:12px 13px;border-radius:19px}.sub{display:none}.actions .btn.help{display:none}.game{border-radius:19px}iframe{height:calc(100svh - 112px);min-height:520px}.footer{font-size:10px}.footer .source{display:none}}
    @media(max-width:430px){h1{font-size:25px}.btn{padding:8px 10px}.actions{gap:5px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand">
        <div class="eyebrow">♟ नेपाली पात्रो · Games</div>
        <h1>AI Chess</h1>
        <p class="sub">AI विरुद्ध खेल्नुहोस् · touch-friendly · fullscreen-ready</p>
      </div>
      <div class="actions">
        <button class="btn primary" id="fullscreen" type="button">⛶ Fullscreen</button>
        <a class="btn help" href="../">← Games</a>
      </div>
    </header>

    <section class="game" aria-label="AI Chess game">
      <div class="loading" id="loading">♟️ AI Chess loading…</div>
      <iframe id="chess" src="https://sop20games.github.io/ai-chess/" title="AI Chess — play against JavaScript AI" loading="eager" allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>

    <footer class="footer">
      <span>Play directly in your browser. No account required.</span>
      <span class="source">Source: <a href="https://github.com/Sop20Games/ai-chess" target="_blank" rel="noopener noreferrer">Sop20Games/ai-chess</a></span>
      <a href="../">All Games →</a>
    </footer>
  </main>

  <script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script>
  <script>
    const frame=document.getElementById('chess');
    const loading=document.getElementById('loading');
    const fullscreen=document.getElementById('fullscreen');
    frame.addEventListener('load',()=>loading.classList.add('hide'));
    fullscreen.addEventListener('click',async()=>{
      try{
        if(document.fullscreenElement){await document.exitFullscreen();return}
        if(frame.requestFullscreen){await frame.requestFullscreen();return}
        const game=frame.closest('.game');
        if(game?.requestFullscreen) await game.requestFullscreen();
      }catch(e){}
    });
    document.addEventListener('fullscreenchange',()=>{
      fullscreen.textContent=document.fullscreenElement?'✕ Exit Fullscreen':'⛶ Fullscreen';
    });
  </script>
</body>
</html>
