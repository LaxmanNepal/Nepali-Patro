<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="नेपाली पात्रोमा AI Chess खेल्नुहोस् — browser मै chess खेल र आफ्नो strategy test गर्नुहोस्।">
  <meta name="robots" content="index,follow">
  <title>AI Chess — नेपाली पात्रो गेम्स</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#0b1020}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1f2937 0,#0b1020 48%,#050814 100%)}
    body{padding:14px}
    .shell{width:min(1200px,100%);margin:auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 12px;max-width:1100px}
    .brand{font-weight:900;font-size:15px;letter-spacing:.01em}
    .back{display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff1c;padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;backdrop-filter:blur(12px)}
    .game{width:min(1100px,100%);margin:auto;border:1px solid #ffffff18;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 25px 80px #0008}
    .game iframe{display:block;width:100%;height:min(88vh,900px);min-height:600px;border:0;background:#111}
    .note{max-width:1100px;margin:12px auto 0;color:#aeb7c8;font-size:12px;line-height:1.5;text-align:center}
    .note a{color:#dbeafe}
    @media(max-width:700px){body{padding:8px}.top{margin-bottom:8px}.game{border-radius:15px}.game iframe{height:calc(100vh - 64px);min-height:520px}.brand{font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top" aria-label="Game navigation">
      <div class="brand">♟️ नेपाली पात्रो · AI Chess</div>
      <a class="back" href="../">← सबै गेम्स</a>
    </nav>
    <section class="game" aria-label="AI Chess game">
      <iframe src="https://sop20games.github.io/ai-chess/" title="AI Chess" loading="eager" allow="fullscreen" allowfullscreen></iframe>
    </section>
    <p class="note">AI Chess game source: <a href="https://github.com/Sop20Games/ai-chess" rel="noopener noreferrer">Sop20Games/ai-chess</a> · MIT licensed. Game is embedded from the author's published demo.</p>
  </main>
</body>
</html>
