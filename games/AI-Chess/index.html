e" id="game"><div class="loading" id="loading">♟️ AI Chess loading…</div><iframe id="chess" src="vendor/game.html" title="AI Chess — play against JavaScript AI" loading="eager" allow="fullscreen" allowfullscreen></iframe><div class="toolbar"><button id="newtab">↗ Open game</button><button id="copy">🔗 Copy game link</button><button id="reset">↻ Reset stats</button></div></section><footer class="footer"><span>Free browser game · No account required.</span><span class="source">Original project: <a href="https://github.com/Sop20Games/ai-chess" target="_blank" rel="noopener noreferrer">Sop20Games/ai-chess</a></span><a href="../">All Games →</a></footer></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script><script>const f=document.getElementById('chess'),l=document.getElementById('loading'),fs=document.getElementById('fullscreen'),p=document.getElementById('plays'),s=document.getElementById('session');let n=Number(localStorage.getItem('np-ai-chess-plays')||0);p.textContent=n;f.addEventListener('load',()=>{l.classList.add('hide');n++;localStorage.setItem('np-ai-chess-plays',n);p.textContent=n});fs.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('game').requestFullscreen()}catch(e){}};document.addEventListener('fullscreenchange',()=>fs.textContent=document.fullscreenElement?'✕ Exit Fullscreen':'⛶ Fullscreen');document.getElementById('newtab').onclick=()=>window.open('vendor/game.html','_blank','noopener');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copy').textContent='✓ Copied'}catch(e){}};document.getElementById('reset').onclick=()=>{n=0;localStorage.removeItem('np-ai-chess-plays');p.textContent='0'};const t=Date.now();setInterval(()=>{let x=Math.floor((Date.now()-t)/1000);s.textContent=Math.floor(x/60)+':'+String(x%60).padStart(2,'0')},1000);</script></body></html>
