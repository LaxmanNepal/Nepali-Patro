<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b91c1c"><meta name="description" content="नेपाली पात्रोमा AI Chess खेल्नुहोस्। Browser मै chess AI विरुद्ध खेल्नुहोस्।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://apps.laxmannepal.com.np/Nepali-Patro/games/AI-Chess/"><link rel="manifest" href="./manifest.webmanifest"><title>AI Chess — नेपाली पात्रो गेम्स</title><style>:root{--r:#b91c1c;--r2:#dc2626;--i:#101828;--m:#667085;--l:#e4e7ec}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fff7f7,#f8fafc 48%,#fff);color:var(--i);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px}.page{width:min(1240px,100%);margin:auto}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;margin-bottom:9px;border:1px solid #fee2e2;border-radius:22px;background:#ffffffd6;backdrop-filter:blur(18px);box-shadow:0 12px 40px #10182812}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.1em;color:var(--r)}h1{font-size:clamp(24px,5vw,36px);line-height:1;margin:4px 0}.sub{margin:0;color:var(--m);font-size:12px}.actions,.toolbar{display:flex;gap:7px;flex-wrap:wrap}.btn,.toolbar button{border:1px solid var(--l);background:#fff;color:#344054;text-decoration:none;cursor:pointer;padding:9px 12px;border-radius:12px;font-size:11px;font-weight:900}.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--r),var(--r2))}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}.stat{padding:9px 11px;border:1px solid var(--l);border-radius:14px;background:#ffffffc7}.stat b{display:block;font-size:15px}.stat span{color:var(--m);font-size:10px}.game{position:relative;overflow:hidden;border-radius:26px;background:#111;box-shadow:0 22px 70px #10182826}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#111827;color:#fff;font-size:13px;font-weight:800;z-index:2;transition:opacity .3s}.loading.hide{opacity:0;pointer-events:none}.loading.error{background:#3b0b0b;color:#fecaca;text-align:center;padding:30px}.loading button{margin-top:12px}.stage{position:relative}iframe{position:relative;z-index:1;display:block;width:100%;height:min(80vh,900px);min-height:620px;border:0;background:#111}.toolbar{padding:9px;background:#fff}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;padding:10px 12px;border:1px solid var(--l);border-radius:15px;background:#ffffffbf;color:var(--m);font-size:10px}.footer a{color:var(--r);font-weight:900;text-decoration:none}@media(max-width:700px){body{padding:6px}.hero{border-radius:18px;padding:11px 12px}.sub,.source{display:none}.stats{grid-template-columns:repeat(2,1fr)}.game{border-radius:19px}iframe{height:calc(100svh - 190px);min-height:500px}}
</style></head><body><main class="page"><header class="hero"><div><div class="eyebrow">♟ नेपाली पात्रो · GAMES</div><h1>AI Chess</h1><p class="sub">AI विरुद्ध खेल्नुहोस् · touch-friendly · fullscreen · PWA</p></div><div class="actions"><button class="btn primary" id="fullscreen">⛶ Fullscreen</button><a class="btn" href="../">← Games</a></div></header><section class="stats"><div class="stat"><b id="plays">0</b><span>Games opened</span></div><div class="stat"><b id="session">0:00</b><span>Session time</span></div><div class="stat"><b id="best">0:00</b><span>Best session</span></div><div class="stat"><b>♟️ AI</b><span>JavaScript engine</span></div></section><section class="game" id="game"><div class="stage"><div class="loading" id="loading">♟️ AI Chess loading…</div><iframe id="chess" src="vendor/game.html" title="AI Chess — play against JavaScript AI" loading="eager" allow="fullscreen" allowfullscreen></iframe></div><div class="toolbar"><button id="newtab">↗ Open game</button><button id="copy">🔗 Copy page</button><button id="install" hidden>📲 Install</button><button id="reset">↻ Reset stats</button></div></section><footer class="footer"><span>Free browser game · No account required.</span><span class="source">Original project: <a href="https://github.com/Sop20Games/ai-chess" target="_blank" rel="noopener noreferrer">Sop20Games/ai-chess</a></span><a href="../">All Games →</a></footer></main><script>const $=id=>document.getElementById(id),KEY='np-ai-chess';let data=JSON.parse(localStorage.getItem(KEY)||'{"plays":0,"best":0}');$('plays').textContent=data.plays;$('best').textContent=new Date(data.best*1000).toISOString().substr(14,5);const f=$('chess'),l=$('loading');f.addEventListener('load',()=>{l.classList.add('hide');data.plays++;localStorage.setItem(KEY,JSON.stringify(data));$('plays').textContent=data.plays});f.addEventListener('error',()=>{l.className='loading error';l.innerHTML='AI Chess source is not available yet.<br><small>Please refresh after the GitHub source-sync finishes.</small>'});$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('game').requestFullscreen()}catch(e){}};document.addEventListener('fullscreenchange',()=>$('fullscreen').textContent=document.fullscreenElement?'✕ Exit Fullscreen':'⛶ Fullscreen');$('newtab').onclick=()=>window.open('vendor/game.html','_blank','noopener');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='✓ Copied'}catch(e){}};$('reset').onclick=()=>{data={plays:0,best:0};localStorage.setItem(KEY,JSON.stringify(data));$('plays').textContent='0';$('best').textContent='0:00'};const started=Date.now();setInterval(()=>{const sec=Math.floor((Date.now()-started)/1000);$('session').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec>data.best){data.best=sec;localStorage.setItem(KEY,JSON.stringify(data));$('best').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}},1000);let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true};if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
