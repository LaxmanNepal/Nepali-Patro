<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐍 सर्प खेल — नेपाली पात्रो</title><style>body{margin:0;background:#f7f8fa;font-family:system-ui,sans-serif}.g{max-width:620px;margin:auto;padding:30px 12px}.card{text-align:center;background:#fff;border:1px solid #e4e7ec;border-radius:26px;padding:22px;box-shadow:0 12px 35px #10182812}h1{font-size:clamp(32px,8vw,54px)}canvas{width:min(92vw,500px);height:min(92vw,500px);background:#101828;border-radius:18px;display:block;margin:15px auto}.btn{border:0;border-radius:12px;padding:11px 17px;background:#b91c1c;color:#fff;font-weight:900}.back{display:block;margin-top:18px;color:#b91c1c;font-weight:800;text-decoration:none}</style></head><body><main class="g"><div class="card"><div>🎮 नेपाली पात्रो गेम्स</div><h1>🐍 सर्प खेल</h1><div id="s">Score: 0 · Arrow keys / swipe</div><canvas id="c" width="400" height="400"></canvas><button class="btn" id="n">नयाँ खेल</button><a class="back" href="../">← सबै खेलहरू</a></div></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#s');let snake,food,d,score,timer;function start(){snake=[[10,10],[9,10],[8,10]];food=[15,15];d=[1,0];score=0;clearInterval(timer);timer=setInterval(tick,110);draw()}function tick(){const h=[snake[0][0]+d[0],snake[0][1]+d[1]];if(h[0]<0||h[1]<0||h[0]>=20||h[1]>=20||snake.some(p=>p[0]===h[0]&&p[1]===h[1]))return game();snake.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;food=[Math.floor(Math.random()*20),Math.floor(Math.random()*20)]}else snake.pop();draw()}function game(){clearInterval(timer);s.textContent=`Game Over · Score: ${score}`}function draw(){x.clearRect(0,0,400,400);x.fillStyle='#b91c1c';x.fillRect(food[0]*20,food[1]*20,20,20);x.fillStyle='#fff';snake.forEach(p=>x.fillRect(p[0]*20+2,p[1]*20+2,16,16));s.textContent=`Score: ${score} · Arrow keys / swipe`}document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'&&d[1]!==1)d=[0,-1];if(k==='ArrowDown'&&d[1]!==-1)d=[0,1];if(k==='ArrowLeft'&&d[0]!==1)d=[-1,0];if(k==='ArrowRight'&&d[0]!==-1)d=[1,0]});c.addEventListener('touchstart',e=>c._t=e.touches[0]);c.addEventListener('touchend',e=>{const t=e.changedTouches[0],o=c._t,dx=t.clientX-o.clientX,dy=t.clientY-o.clientY;if(Math.abs(dx)>Math.abs(dy))d=dx>0&&d[0]!==-1?[1,0]:dx<0&&d[0]!==1?[-1,0]:d;else d=dy>0&&d[1]!==-1?[0,1]:dy<0&&d[1]!==1?[0,-1]:d});document.querySelector('#n').onclick=start;start()</script></body></html>
