<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b91c1c"><title>Quick Challenge — Nepali Patro</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#111827}.wrap{max-width:620px;margin:auto;padding:24px 14px 50px}.top{text-align:center}.badge{display:inline-block;background:#fee2e2;color:#b91c1c;padding:7px 12px;border-radius:99px;font-weight:800;font-size:12px}.card{background:white;border:1px solid #e5e7eb;border-radius:28px;padding:24px;box-shadow:0 15px 40px #0000000d}.score{display:flex;justify-content:space-between;font-weight:800;color:#667085}.arena{min-height:330px;display:grid;place-items:center;position:relative}.target{width:125px;height:125px;border:0;border-radius:50%;background:#b91c1c;color:white;font-size:22px;font-weight:950;box-shadow:0 12px 30px #b91c1c44;touch-action:manipulation}.target:active{transform:scale(.94)}button{cursor:pointer}.hidden{display:none}.result{text-align:center}.big{font-size:48px;font-weight:950}.actions{display:flex;gap:10px}.actions button{flex:1;padding:14px;border:0;border-radius:14px;font-weight:900}.primary{background:#b91c1c;color:white}.secondary{background:#f1f5f9;color:#111827}</style></head><body><main class="wrap"><section class="top"><span class="badge">⚡ DAILY REFLEX</span><h1>Quick Challenge</h1><p>Wait for the target, then tap as fast as you can. Build your best streak.</p></section><div class="card"><div class="score"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Streak <b id="streak">0</b></span></div><div id="arena" class="arena"><button id="target" class="target">WAIT</button></div><div id="result" class="result hidden"><div class="big" id="time">0 ms</div><p id="message"></p><div class="actions"><button class="primary" id="again">Play Again</button><button class="secondary" id="home">Games</button></div></div></div></main><script>const target=document.getElementById('target'),arena=document.getElementById('arena'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),streakEl=document.getElementById('streak'),result=document.getElementById('result'),timeEl=document.getElementById('time'),msg=document.getElementById('message');let state='idle',started=0,score=0,streak=0,timer;let best=+localStorage.quickBest||0;bestEl.textContent=best;function start(){clearTimeout(timer);state='waiting';target.textContent='WAIT…';target.style.background='#111827';result.classList.add('hidden');arena.style.display='grid';timer=setTimeout(()=>{state='ready';started=performance.now();target.textContent='TAP!';target.style.background='#16a34a'},700+Math.random()*2500)}function tap(){if(state==='idle')return start();if(state==='waiting'){clearTimeout(timer);state='idle';target.textContent='TOO SOON';target.style.background='#dc2626';streak=0;streakEl.textContent=streak;setTimeout(start,700);return}if(state==='ready'){const ms=Math.round(performance.now()-started);score+=Math.max(1,1000-ms);streak++;scoreEl.textContent=score;streakEl.textContent=streak;if(score>best){best=score;localStorage.quickBest=best;bestEl.textContent=best}state='idle';target.textContent='NICE!';target.style.background='#b91c1c';setTimeout(start,500)}}target.addEventListener('pointerdown',tap);document.getElementById('again').onclick=()=>{score=0;streak=0;scoreEl.textContent=0;streakEl.textContent=0;start()};document.getElementById('home').onclick=()=>location.href='../';start()</script><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script></body></html>
