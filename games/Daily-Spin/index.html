<!doctype html><html lang=ne><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Daily Spin — Nepali Patro</title><style>body{margin:0;background:#fff7ed;color:#1f2937;font-family:system-ui;text-align:center}main{max-width:560px;margin:auto;padding:25px 14px}.wheel{width:min(82vw,360px);height:min(82vw,360px);border-radius:50%;margin:28px auto;background:conic-gradient(#ef4444 0 45deg,#f59e0b 45deg 90deg,#22c55e 90deg 135deg,#3b82f6 135deg 180deg,#8b5cf6 180deg 225deg,#ec4899 225deg 270deg,#14b8a6 270deg 315deg,#eab308 315deg 360deg);border:10px solid white;box-shadow:0 15px 45px #0002;transition:transform 3s cubic-bezier(.15,.8,.2,1)}button{border:0;border-radius:16px;background:#b91c1c;color:white;padding:15px 28px;font-weight:950;font-size:17px}.pin{font-size:30px}#out{font-size:25px;font-weight:900;min-height:35px}</style></head><body><main><div class=pin>📅</div><h1>Daily Spin</h1><p>One free spin every day. What will you get?</p><div class=wheel id=w></div><button id=spin>SPIN TODAY</button><div id=out></div></main><script>const w=document.getElementById('w'),b=document.getElementById('spin'),o=document.getElementById('out'),items=['🔥 Great!','⭐ Lucky!','🎯 Perfect!','🪙 Bonus!','🏆 Champion!','⚡ Fast!','💎 Amazing!','🎉 Winner!'];const key='dailySpin-'+new Date().toISOString().slice(0,10);if(localStorage[key]){b.disabled=true;o.textContent='Already spun today. Come back tomorrow!';}b.onclick=()=>{b.disabled=true;w.style.transform='rotate('+(1440+Math.random()*1440)+'deg)';setTimeout(()=>o.textContent=items[Math.floor(Math.random()*items.length)],3100);localStorage[key]=1}</script><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script></body></html>
