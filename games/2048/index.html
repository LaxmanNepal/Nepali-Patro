<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔢 2048 — नेपाली पात्रो</title><style>body{margin:0;background:#f7f8fa;font-family:system-ui,sans-serif}.g{max-width:600px;margin:auto;padding:30px 12px}.card{text-align:center;background:#fff;border:1px solid #e4e7ec;border-radius:26px;padding:22px;box-shadow:0 12px 35px #10182812}h1{font-size:clamp(38px,9vw,60px);margin:8px}.score{font-weight:800;color:#667085}.board{width:min(92vw,430px);aspect-ratio:1;background:#d0d5dd;padding:8px;border-radius:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px auto}.t{display:grid;place-items:center;background:#f2f4f7;border-radius:10px;font-size:clamp(22px,7vw,36px);font-weight:950}.v2{background:#fff}.v4{background:#fff1f2}.v8{background:#fecdd3}.v16{background:#fda4af}.v32{background:#fb7185}.v64{background:#e11d48;color:#fff}.v128,.v256,.v512,.v1024,.v2048{background:#b91c1c;color:#fff}.btn{border:0;border-radius:12px;padding:11px 17px;background:#b91c1c;color:#fff;font-weight:900}.back{display:block;margin-top:18px;color:#b91c1c;font-weight:800;text-decoration:none}</style></head><body><main class="g"><div class="card"><div>🎮 नेपाली पात्रो गेम्स</div><h1>🔢 2048</h1><div class="score" id="s">Score: 0 · Swipe / Arrow keys</div><div class="board" id="b"></div><button class="btn" id="n">नयाँ खेल</button><a class="back" href="../">← सबै खेलहरू</a></div></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script><script>const b=document.querySelector('#b'),s=document.querySelector('#s');let a,score=0;function start(){a=Array(16).fill(0);score=0;add();add();render()}function add(){const z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}function render(){b.innerHTML=a.map(v=>`<div class="t ${v?'v'+v:''}">${v||''}</div>`).join('');s.textContent=`Score: ${score} · Swipe / Arrow keys`}function slide(row){let q=row.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;score+=q[i];q.splice(i+1,1)}return q.concat(Array(4-q.length).fill(0))}function move(dir){let old=a.join(),rows=[];if(dir==='L'||dir==='R')for(let r=0;r<4;r++){let row=a.slice(r*4,r*4+4);if(dir==='R')row.reverse();row=slide(row);if(dir==='R')row.reverse();rows.push(row)}else{for(let c=0;c<4;c++){let row=[a[c],a[c+4],a[c+8],a[c+12]];if(dir==='D')row.reverse();row=slide(row);if(dir==='D')row.reverse();for(let r=0;r<4;r++)a[r*4+c]=row[r]}}if(dir==='L'||dir==='R')a=rows.flat();if(a.join()!==old){add();render()}}document.addEventListener('keydown',e=>{({ArrowLeft:()=>move('L'),ArrowRight:()=>move('R'),ArrowUp:()=>move('U'),ArrowDown:()=>move('D')})[e.key]?.()});let sx=0,sy=0;b.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});b.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'R':'L':dy>0?'D':'U')});document.querySelector('#n').onclick=start;start()</script></body></html>
