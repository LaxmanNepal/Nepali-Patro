<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="description" content="नेपाली पात्रोका सबै खेलहरू — बाघचाल र भविष्यमा थपिने नेपाली खेलहरू एउटै ठाउँमा।">
<title>खेलहरू — नेपाली पात्रो</title>
<style>
.games-page{max-width:1120px;margin:auto;padding:clamp(24px,5vw,52px) 14px 60px}
.games-hero{text-align:center;margin-bottom:30px}
.games-kicker{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fff1f2;color:#b91c1c;font-size:13px;font-weight:900;border:1px solid #fecdd3}
.games-hero h1{font-size:clamp(38px,7vw,64px);line-height:1.05;margin:14px 0 10px;letter-spacing:-1.5px}
.games-hero p{margin:0 auto;color:#667085;font-size:16px;max-width:620px;line-height:1.65}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.game-tile{position:relative;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;text-decoration:none;color:#171717;background:#fff;border:1px solid #e4e7ec;border-radius:28px;padding:26px;box-shadow:0 12px 35px rgba(16,24,40,.08);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.game-tile:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(16,24,40,.13);border-color:#fda4af}
.game-number{font-size:12px;font-weight:900;color:#b91c1c;letter-spacing:.08em;text-transform:uppercase}
.game-emoji{font-size:72px;line-height:1;margin:18px 0 8px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.08))}
.game-name{font-size:clamp(30px,5vw,44px);font-weight:950;line-height:1;margin:0;letter-spacing:-1px}
.game-desc{margin:9px 0 0;color:#667085;font-size:13px;line-height:1.5}
.game-play{align-self:flex-start;margin-top:22px;padding:11px 15px;border-radius:12px;background:#b91c1c;color:#fff;font-weight:900;font-size:13px}
.game-tile::after{content:"";position:absolute;width:150px;height:150px;right:-55px;bottom:-65px;border-radius:50%;background:#fff1f2;z-index:0}
.game-tile>*{position:relative;z-index:1}
@media(max-width:600px){.games-page{padding:20px 10px 42px}.games-hero{margin-bottom:22px}.game-tile{min-height:235px;padding:22px;border-radius:23px}.game-emoji{font-size:60px}.game-name{font-size:36px}}
</style>
</head>
<body>
<main class="games-page">
<section class="games-hero">
<span class="games-kicker">🎮 नेपाली पात्रो गेम्स</span>
<h1>खेलहरू</h1>
<p>नेपाली पात्रोभित्र उपलब्ध सबै खेलहरू एउटै ठाउँमा। नयाँ खेल थपिँदै जाँदा यही पेजमा भेटिनेछन्।</p>
</section>
<section class="games-grid" aria-label="सबै खेलहरू">
<a class="game-tile" href="https://apps.laxmannepal.com.np/Nepali-Patro/games/Baghchal/" aria-label="बाघचाल खेल्नुहोस्">
<div><div class="game-number">GAME 01</div><div class="game-emoji">🐅</div><h2 class="game-name">बाघचाल</h2><p class="game-desc">बाघ र बाख्राबीचको परम्परागत नेपाली रणनीतिक खेल।</p></div>
<span class="game-play">खेल सुरु गर्नुहोस् →</span>
</a>
</section>
</main>
<script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/mobile-nav.js"></script>
</body>
</html>
