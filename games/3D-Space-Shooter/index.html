<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>3D Space Shooter</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020617;font-family:system-ui;color:white;touch-action:none}#hud{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);background:#0009;padding:10px 18px;border-radius:15px;font-weight:900}.panel{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:#020617bb}.box{width:min(390px,90vw);padding:28px;text-align:center;background:#0f172af5;border:1px solid #fff2;border-radius:26px}.box h1{font-size:36px}.box p{color:#cbd5e1;line-height:1.5}.btn{border:0;border-radius:14px;padding:13px 22px;background:#8b5cf6;color:#fff;font-weight:900;font-size:16px}canvas{display:block}</style></head><body><div id="hud">🚀 Score <span id="score">0</span> · ❤️ <span id="hp">3</span></div><div class="panel" id="panel"><div class="box"><h1>🚀 3D Space Shooter</h1><p>Move left and right, dodge asteroids and destroy incoming targets by tapping/clicking.</p><button class="btn" id="go">Launch</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script><script>const s=new THREE.Scene();s.background=new THREE.Color(0x020617);const c=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);c.position.z=12;const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);s.add(new THREE.AmbientLight(0x99aaff,1.4));let stars=[];for(let i=0;i<250;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.04,5,5),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set((Math.random()-.5)*60,(Math.random()-.5)*40,-Math.random()*180);s.add(m);stars.push(m)}function ship(){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.ConeGeometry(.8,2.8,6),new THREE.MeshStandardMaterial({color:0x38bdf8,metalness:.5}));body.rotation.x=Math.PI/2;g.add(body);return g}const p=ship();p.position.z=6;s.add(p);let enemies=[],shots=[],score=0,hp=3,running=false,last=0;function spawn(){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(.7+Math.random()*.7,1),new THREE.MeshStandardMaterial({color:0xef4444,roughness:.9}));m.position.set((Math.random()-.5)*12,(Math.random()-.5)*7,-100);s.add(m);enemies.push(m)}function shoot(){if(!running)return;let b=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0x67e8f9}));b.position.copy(p.position);b.position.z-=1;s.add(b);shots.push(b)}function move(x){p.position.x=Math.max(-6,Math.min(6,p.position.x+x));}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.code==='Space')shoot()});addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')p.position.x=(e.clientX/innerWidth-.5)*12});addEventListener('pointerdown',shoot);document.getElementById('go').onclick=()=>{running=true;score=0;hp=3;document.getElementById('score').textContent=0;document.getElementById('hp').textContent=3;document.getElementById('panel').style.display='none';last=performance.now()};function over(){running=false;document.querySelector('.box h1').textContent='💥 Mission Over';document.querySelector('.box p').textContent='Final score: '+score;document.getElementById('go').textContent='Play Again';document.getElementById('panel').style.display='grid'}function loop(t){requestAnimationFrame(loop);if(running){let dt=Math.min(.04,(t-last)/1000);last=t;if(Math.random()<dt*.8)spawn();stars.forEach(x=>{x.position.z+=25*dt;if(x.position.z>12)x.position.z=-180});shots.forEach((b,i)=>{b.position.z-=70*dt;if(b.position.z<-120){s.remove(b);shots.splice(i,1)}});enemies.forEach((e,i)=>{e.position.z+=18*dt;e.rotation.x+=dt;e.rotation.y+=dt;if(Math.abs(e.position.z-p.position.z)<1.1&&Math.abs(e.position.x-p.position.x)<1.2){hp--;document.getElementById('hp').textContent=hp;s.remove(e);enemies.splice(i,1);if(hp<=0)over()}shots.forEach((b,j)=>{if(b.position.distanceTo(e.position)<1){score+=10;document.getElementById('score').textContent=score;s.remove(b);s.remove(e);shots.splice(j,1);enemies.splice(i,1)}});if(e.position.z>14){s.remove(e);enemies.splice(i,1)}})}r.render(s,c)}loop();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
