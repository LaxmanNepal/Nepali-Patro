<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="टिक ट्याक टो — नेपाली पात्रो गेम्स"><title>❌⭕ टिक ट्याक टो — नेपाली पात्रो</title><style>body{margin:0;background:#f7f8fa;font-family:system-ui,sans-serif;color:#171717}.g{max-width:700px;margin:auto;padding:35px 14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:26px;padding:25px;box-shadow:0 12px 35px #10182812;text-align:center}h1{font-size:clamp(34px,8vw,58px);margin:10px 0}.status{font-weight:800;color:#667085;margin:10px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:430px;margin:20px auto}.cell{aspect-ratio:1;border:0;border-radius:18px;background:#f2f4f7;font-size:clamp(42px,12vw,72px);font-weight:900;cursor:pointer}.cell:hover{background:#fff1f2}.btn{border:0;border-radius:12px;padding:12px 18px;background:#b91c1c;color:#fff;font-weight:900;cursor:pointer}.back{display:inline-block;margin-top:16px;color:#b91c1c;text-decoration:none;font-weight:800}</style></head><body><main class="g"><div class="card"><div>🎮 नेपाली पात्रो गेम्स</div><h1>❌⭕ टिक ट्याक टो</h1><div class="status" id="s">तपाईं X हुनुहुन्छ — चाल चल्नुहोस्</div><div class="board" id="b"></div><button class="btn" id="r">नयाँ खेल</button><br><a class="back" href="../">← सबै खेलहरू</a></div></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script><script>const b=document.querySelector('#b'),s=document.querySelector('#s'),r=document.querySelector('#r');let a=Array(9).fill(''),turn='X',done=false;function win(){for(const x of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(a[x[0]]&&a[x[0]]===a[x[1]]&&a[x[1]]===a[x[2]])return a[x[0]];return a.every(Boolean)?'draw':null}function draw(){b.innerHTML=a.map((v,i)=>`<button class="cell" data-i="${i}">${v}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>move(+x.dataset.i))}function move(i){if(done||a[i])return;a[i]=turn;let w=win();if(w){done=true;s.textContent=w==='draw'?'बराबरी भयो!':`🎉 ${w} जित्यो!`;draw();return}turn=turn==='X'?'O':'X';s.textContent=`${turn} को पालो`;draw()}r.onclick=()=>{a=Array(9).fill('');turn='X';done=false;s.textContent='तपाईं X हुनुहुन्छ — चाल चल्नुहोस्';draw()};draw()</script></body></html>
