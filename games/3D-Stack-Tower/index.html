<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>3D Stack Tower</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff;touch-action:none}#hud{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);background:#0009;padding:10px 18px;border-radius:15px;font-weight:900}.panel{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:#020617bb}.box{width:min(380px,90vw);text-align:center;padding:28px;background:#0f172af5;border:1px solid #fff2;border-radius:26px}.box h1{font-size:38px;margin:0 0 8px}.box p{color:#cbd5e1;line-height:1.5}.btn{border:0;border-radius:14px;padding:13px 22px;background:#f59e0b;color:#111827;font-weight:900;font-size:16px}canvas{display:block}</style></head><body><div id="hud">🏗️ Floor <span id="score">1</span></div><div class="panel" id="panel"><div class="box"><h1>🏗️ 3D Stack Tower</h1><p>Tap or press Space when the moving block lines up. Build the tallest tower.</p><button class="btn" id="go">Start Building</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script><script>const s=new THREE.Scene();s.background=new THREE.Color(0x07111f);s.fog=new THREE.Fog(0x07111f,15,80);const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);c.position.set(8,8,12);c.lookAt(0,4,0);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);s.add(new THREE.HemisphereLight(0xffffff,0x334155,1.8));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(6,12,8);s.add(sun);const blocks=[];function addBlock(x,y,z,w=5,d=5,color=0x38bdf8){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.9,d),new THREE.MeshStandardMaterial({color,metalness:.1,roughness:.45}));m.position.set(x,y,z);s.add(m);blocks.push(m);return m}addBlock(0,-.5,0);let active=null,floor=1,dir=1,speed=5,running=false,last=0;function start(){blocks.slice(1).forEach(b=>s.remove(b));blocks.length=1;floor=1;document.getElementById('score').textContent=1;active=addBlock(-7,.5,0,5,5,0xf59e0b);running=true;document.getElementById('panel').style.display='none';last=performance.now()}function drop(){if(!running)return;let prev=blocks[blocks.length-1],dx=active.position.x-prev.position.x,dz=active.position.z-prev.position.z;let overlapX=active.geometry.parameters.width/2+prev.geometry.parameters.width/2-Math.abs(dx);let overlapZ=active.geometry.parameters.depth/2+prev.geometry.parameters.depth/2-Math.abs(dz);if(overlapX<=0||overlapZ<=0){running=false;document.querySelector('.box h1').textContent='💥 Tower Fell';document.querySelector('.box p').textContent='You reached floor '+floor+'.';document.getElementById('go').textContent='Build Again';document.getElementById('panel').style.display='grid';return}let w=Math.min(active.geometry.parameters.width,overlapX),d=Math.min(active.geometry.parameters.depth,overlapZ);s.remove(active);active=addBlock(prev.position.x+(dx>0?overlapX/2:-overlapX/2),floor*.9,prev.position.z+(dz>0?overlapZ/2:-overlapZ/2),w,d,0x38bdf8+((floor*123456)&0xffffff));floor++;document.getElementById('score').textContent=floor;dir*=-1;active=addBlock(dir>0?-7:7,floor*.9,prev.position.z,w,d,0xf59e0b)}function loop(t){requestAnimationFrame(loop);if(running){let dt=Math.min(.04,(t-last)/1000);last=t;active.position.x+=dir*speed*dt;if(Math.abs(active.position.x)>8)dir*=-1;c.position.y+=(floor*.45+6-c.position.y)*dt*2;c.lookAt(0,floor*.45,0)}r.render(s,c)}document.getElementById('go').onclick=start;addEventListener('pointerdown',drop);addEventListener('keydown',e=>{if(e.code==='Space')drop()});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});loop()</script></body></html>
