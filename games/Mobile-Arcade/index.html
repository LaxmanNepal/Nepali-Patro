<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b91c1c"><title>Mobile Arcade — नेपाली पात्रो</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#111827;touch-action:manipulation}header{padding:18px 14px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:4}h1{margin:0;font-size:25px}.sub{color:#64748b;font-size:13px}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.pick{border:1px solid #e5e7eb;background:#fff;border-radius:18px;padding:14px;text-align:left;min-height:105px;font-weight:900;font-size:16px}.pick b{display:block;font-size:32px;margin-bottom:5px}.pick small{color:#64748b;font-weight:600}.active{border-color:#b91c1c;box-shadow:0 5px 20px #b91c1c18}.stage{margin:0 12px 24px;background:#111827;border-radius:22px;min-height:430px;position:relative;overflow:hidden;color:white}canvas{display:block;width:100%;height:430px;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:900;z-index:2}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:900;font-size:22px;background:#0008;z-index:3}.controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:center;gap:10px;z-index:3}.btn{border:0;border-radius:14px;padding:13px 18px;background:#fff;color:#111827;font-weight:900}.back{display:inline-block;margin:0 14px 18px;color:#b91c1c;text-decoration:none;font-weight:900}</style></head><body><header><h1>📱 Mobile Arcade</h1><div class="sub">Touch-friendly mini games — no app install</div></header><div class="games" id="games"></div><section class="stage"><div class="hud"><span id="title">Choose a game</span><span id="score">0</span></div><canvas id="c"></canvas><div class="msg" id="msg">Choose a game above</div><div class="controls" id="controls"></div></section><a class="back" href="../">← All Nepali Patro games</a><script>
const C=document.getElementById('c'),x=C.getContext('2d'),msg=document.getElementById('msg'),scoreEl=document.getElementById('score'),title=document.getElementById('title'),controls=document.getElementById('controls');let W,H,raf,score=0,mode='';function size(){W=C.width=C.clientWidth*devicePixelRatio;H=C.height=C.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=C.clientWidth;H=C.clientHeight}addEventListener('resize',size);size();
const games=[['🐦','Flappy Tap','Tap to fly'],['🏓','Pong','Touch to move'],['🧱','Brick Breaker','Drag paddle'],['🚗','Road Dodge','Swipe left/right'],['🍎','Fruit Catch','Move basket'],['🎯','Whack','Tap targets'],['💣','Mine Sweep','Tap safe cells'],['🔴','Connect 4','Tap columns'],['⚡','Reaction','Tap when green'],['➕','Math Rush','Answer quickly'],['🪙','Coin Tap','Tap coins'],['🦘','Jump Runner','Tap to jump']];document.getElementById('games').innerHTML=games.map((g,i)=>`<button class="pick" data-i="${i}"><b>${g[0]}</b>${g[1]}<small>${g[2]}</small></button>`).join('');document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>start(+b.dataset.i));
function ui(t){title.textContent=t;score=0;scoreEl.textContent=0;msg.style.display='none';controls.innerHTML='<button class="btn" id="restart">↻ Restart</button>';document.getElementById('restart').onclick=()=>start(games.findIndex(g=>g[1]===t));document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('active',games[+b.dataset.i][1]===t))}function end(t){cancelAnimationFrame(raf);msg.innerHTML=t+`<br><button class="btn" style="margin-top:15px" onclick="start(games.findIndex(g=>g[1]===mode))">Play Again</button>`;msg.style.display='flex'}function loop(fn){cancelAnimationFrame(raf);function f(){fn();raf=requestAnimationFrame(f)}f()}function start(i){mode=games[i][1];ui(mode);if(i===0)flappy();else if(i===1)pong();else if(i===2)brick();else if(i===3)road();else if(i===4)catcher();else if(i===5)whack();else if(i===6)mines();else if(i===7)connect();else if(i===8)reaction();else if(i===9)math();else if(i===10)coins();else runner()}
let tapX=0;function pointer(cb){C.onpointerdown=e=>{tapX=e.offsetX;cb(e.offsetX,e.offsetY)};C.onpointermove=e=>{if(e.buttons)cb(e.offsetX,e.offsetY)}}
function flappy(){let y=210,v=0,pipes=[],t=0;pointer(()=>v=-7);loop(()=>{x.clearRect(0,0,W,H);v+=.35;y+=v;t++;if(t%100===0)pipes.push({x:W,g:80+Math.random()*180});pipes.forEach(p=>{p.x-=2.7;x.fillStyle='#22c55e';x.fillRect(p.x,0,48,p.g);x.fillRect(p.x,p.g+145,48,H);if(p.x+48<0)pipes.shift();if(p.x<55&&p.x+48>25&&(y<p.g||y>p.g+145))end('Game Over');if(p.x===54)score++});x.fillStyle='#facc15';x.beginPath();x.arc(45,y,15,0,7);x.fill();scoreEl.textContent=score;if(y<0||y>H)end('Game Over')})}
function pong(){let py=H/2-45,by=H/2,bx=W/2,bxv=4,byv=3;pointer(y=>py=Math.max(0,Math.min(H-90,y-45)));loop(()=>{x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(12,py,12,90);x.fillRect(W-24,by-45,12,90);x.beginPath();x.arc(bx,by,9,0,7);x.fill();bx+=bxv;by+=byv;if(by<8||by>H-8)byv*=-1;if(bx<30&&by>py&&by<py+90)bxv=Math.abs(bxv);if(bx>W-35&&by>by-45&&by<by+45)bxv=-Math.abs(bxv);if(bx<0){end('Computer wins');}if(bx>W){score++;bx=W/2;bxv=-4;scoreEl.textContent=score}})}
function brick(){let px=W/2,br=[],ball={x:W/2,y:H-80,vx:3,vy:-4};for(let r=0;r<5;r++)for(let c=0;c<7;c++)br.push({x:8+c*(W/7),y:45+r*24,w:W/7-10,h:16,on:1});pointer(px2=>px=Math.max(45,Math.min(W-45,px2)));loop(()=>{x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(px-45,H-25,90,12);x.beginPath();x.arc(ball.x,ball.y,8,0,7);x.fill();br.forEach(b=>{if(!b.on)return;x.fillStyle='#fb7185';x.fillRect(b.x,b.y,b.w,b.h);if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=0;ball.vy*=-1;score++;scoreEl.textContent=score}});ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>W-8)ball.vx*=-1;if(ball.y<30)ball.vy*=-1;if(ball.y>H-35&&ball.x>px-50&&ball.x<px+50)ball.vy=-Math.abs(ball.vy);if(ball.y>H)end('Game Over');if(score===35)end('You Win!')})}
function road(){let car=W/2,obs=[],t=0;pointer(px=>car=Math.max(30,Math.min(W-30,px)));loop(()=>{x.clearRect(0,0,W,H);x.fillStyle='#334155';x.fillRect(W*.2,0,W*.6,H);x.strokeStyle='#fff';x.setLineDash([30,25]);x.lineWidth=4;x.beginPath();x.moveTo(W*.5,0);x.lineTo(W*.5,H);x.stroke();x.setLineDash([]);t++;if(t%55===0)obs.push({x:W*.25+Math.random()*W*.5,y:-40});x.fillStyle='#22d3ee';x.fillRect(car-18,H-80,36,60);obs.forEach(o=>{o.y+=4+score/30;x.fillStyle='#ef4444';x.fillRect(o.x-18,o.y,36,60);if(Math.abs(o.x-car)<35&&o.y>H-105&&o.y<H-20)end('Crash!');});obs=obs.filter(o=>o.y<H+60);if(t%60===0){score++;scoreEl.textContent=score}})}
function catcher(){let bx=W/2,items=[],t=0;pointer(px=>bx=Math.max(30,Math.min(W-30,px)));loop(()=>{x.clearRect(0,0,W,H);t++;if(t%35===0)items.push({x:20+Math.random()*(W-40),y:-20});x.fillStyle='#60a5fa';x.fillRect(bx-45,H-35,90,15);items.forEach(o=>{o.y+=4;x.fillStyle='#f43f5e';x.beginPath();x.arc(o.x,o.y,12,0,7);x.fill();if(o.y>H-50&&Math.abs(o.x-bx)<55){score++;scoreEl.textContent=score;o.y=H+99}});items=items.filter(o=>o.y<H+20);if(t>900)end('Score: '+score)})}
function whack(){let target={x:W/2,y:H/2};let t=0;pointer((px,py)=>{if(Math.hypot(px-target.x,py-target.y)<45){score++;scoreEl.textContent=score;target={x:40+Math.random()*(W-80),y:60+Math.random()*(H-120)}}});loop(()=>{x.clearRect(0,0,W,H);t++;x.fillStyle='#fbbf24';x.beginPath();x.arc(target.x,target.y,42,0,7);x.fill();x.fillStyle='#111';x.font='bold 18px system-ui';x.textAlign='center';x.fillText('TAP',target.x,target.y+6);if(t>900)end('Score: '+score)})}
function mines(){let n=5,cell=Math.min(W,H-50)/5,b=[];for(let i=0;i<25;i++)b.push(Math.random()<.2);pointer((px,py)=>{let c=Math.floor(px/cell),r=Math.floor((py-35)/cell),i=r*5+c;if(i<0||i>24)return;if(b[i])end('💣 Mine!');else{score++;scoreEl.textContent=score;b[i]=null;if(score>=20)end('Board cleared!')}});loop(()=>{x.clearRect(0,0,W,H);for(let i=0;i<25;i++){x.fillStyle=b[i]===null?'#22c55e':'#475569';x.fillRect(i%5*cell+2,35+Math.floor(i/5)*cell+2,cell-4,cell-4)}})}
function connect(){let a=Array(42).fill(0),turn=1;pointer(px=>{let c=Math.floor(px/(W/7));for(let r=5;r>=0;r--){let i=r*7+c;if(!a[i]){a[i]=turn;turn=turn===1?2:1;break}}});loop(()=>{x.clearRect(0,0,W,H);for(let i=0;i<42;i++){x.fillStyle=a[i]===1?'#ef4444':a[i]===2?'#facc15':'#334155';x.beginPath();x.arc(i%7*(W/7)+W/14,65+Math.floor(i/7)*55,21,0,7);x.fill()}})}
function reaction(){let ready=false,t=0;msg.style.display='flex';msg.textContent='Wait for GREEN…';setTimeout(()=>{ready=true;msg.style.display='none'},1200+Math.random()*2500);pointer(()=>{if(!ready){end('Too early!')}else{score=1;scoreEl.textContent='✓';end('Great reaction!')}});loop(()=>{x.fillStyle=ready?'#22c55e':'#ef4444';x.fillRect(0,0,W,H)})}
function math(){let q,ans,t=0;function next(){let a=1+Math.floor(Math.random()*20),b=1+Math.floor(Math.random()*20);ans=a+b;msg.style.display='flex';msg.innerHTML=`${a} + ${b} = ?<br><input id="answer" inputmode="numeric" style="font-size:28px;width:130px;margin-top:15px"><button class="btn" onclick="checkMath()">OK</button>`;document.getElementById('answer').focus()}window.checkMath=()=>{if(+document.getElementById('answer').value===ans){score++;scoreEl.textContent=score;if(score>=10)end('Math Master!');else next()}else end('Wrong answer')};next();loop(()=>{})}
function coins(){let p=[];for(let i=0;i<8;i++)p.push({x:30+Math.random()*(W-60),y:60+Math.random()*(H-100),r:18});pointer((px,py)=>{p=p.filter(o=>{if(Math.hypot(px-o.x,py-o.y)<o.r){score++;scoreEl.textContent=score;return false}return true});if(!p.length)end('All coins collected!')});loop(()=>{x.clearRect(0,0,W,H);p.forEach(o=>{x.fillStyle='#facc15';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()})})}
function runner(){let y=H-60,v=0,t=0;pointer(()=>{if(y>=H-60)v=-10});loop(()=>{x.clearRect(0,0,W,H);v+=.5;y+=v;t++;x.fillStyle='#22c55e';x.fillRect(0,H-30,W,30);x.fillStyle='#60a5fa';x.fillRect(35,y-30,30,30);if(t%70===0){let ox=W+20;let id=setInterval(()=>{x.fillStyle='#ef4444';x.fillRect(ox,H-60,25,30);ox-=5;if(ox<0)clearInterval(id);if(ox<65&&ox>30&&y>H-75)end('Hit!')},30)}if(y>H-60)y=H-60;if(t%60===0){score++;scoreEl.textContent=score}})}
</script></body></html>
