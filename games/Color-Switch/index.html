<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Switch — Nepali Patro</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;text-align:center}main{max-width:520px;margin:auto;padding:22px 14px}canvas{width:100%;max-width:420px;background:#111827;border-radius:24px;touch-action:none;display:block;margin:20px auto}button{border:0;border-radius:14px;padding:13px 20px;font-weight:900}</style></head><body><main><h1>🎨 Color Switch</h1><p>Tap when the moving ball matches the target color.</p><b>Score: <span id=s>0</span> · Best: <span id=b>0</span></b><canvas id=c width=420 height=620></canvas><button onclick=reset()>Restart</button></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),colors=['#ef4444','#22c55e','#3b82f6','#eab308'];let y=520,v=-4,score=0,over=0,best=+localStorage.colorBest||0,target=0,ball=1;c.addEventListener('pointerdown',()=>{if(over)return reset();if(ball===target){score++;document.getElementById('s').textContent=score;target=Math.floor(Math.random()*4)}else{over=1}});function reset(){score=0;over=0;target=Math.floor(Math.random()*4);document.getElementById('s').textContent=0;loop()}function loop(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#1e293b';x.fillRect(0,0,c.width,c.height);x.fillStyle=colors[target];x.beginPath();x.arc(210,110,55,0,7);x.fill();y+=v;if(y<190||y>570)v=-v;ball=Math.floor((Date.now()/700)%4);x.fillStyle=colors[ball];x.beginPath();x.arc(210,y,35,0,7);x.fill();x.fillStyle='#fff';x.font='800 20px system-ui';x.textAlign='center';x.fillText(over?'Game Over — tap to restart':'TAP when colors match',210,50);if(over&&score>best){best=score;localStorage.colorBest=best;document.getElementById('b').textContent=best}requestAnimationFrame(loop)}loop()</script><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script></body></html>
