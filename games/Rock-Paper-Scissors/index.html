<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✊✋✌️ रक पेपर सिजर्स — नेपाली पात्रो</title><style>body{margin:0;background:#f7f8fa;font-family:system-ui,sans-serif}.g{max-width:720px;margin:auto;padding:35px 14px}.card{text-align:center;background:#fff;border:1px solid #e4e7ec;border-radius:26px;padding:28px;box-shadow:0 12px 35px #10182812}h1{font-size:clamp(32px,8vw,56px)}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.c{font-size:48px;border:1px solid #ddd;background:#f8f9fb;border-radius:18px;padding:18px;cursor:pointer}.result{font-size:22px;font-weight:900;margin:22px}.score{color:#667085}.back{display:block;margin-top:20px;color:#b91c1c;font-weight:800;text-decoration:none}</style></head><body><main class="g"><div class="card"><div>🎮 नेपाली पात्रो गेम्स</div><h1>✊✋✌️ रक पेपर सिजर्स</h1><p>Computer विरुद्ध खेल्नुहोस्</p><div class="choices"><button class="c" data-v="✊">✊</button><button class="c" data-v="✋">✋</button><button class="c" data-v="✌️">✌️</button></div><div class="result" id="r">आफ्नो चाल छान्नुहोस्</div><div class="score">तपाईं <b id="p">0</b> — Computer <b id="c">0</b></div><a class="back" href="../">← सबै खेलहरू</a></div></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script><script>let ps=0,cs=0;const m={'✊':'✌️','✋':'✊','✌️':'✋'};document.querySelectorAll('.c').forEach(x=>x.onclick=()=>{const p=x.dataset.v,vals=Object.keys(m),c=vals[Math.floor(Math.random()*3)];let t=p===c?'बराबरी!':m[p]===c?'🎉 तपाईं जित्नुभयो!':'Computer जित्यो!';if(t[0]==='🎉')ps++;else if(t[0]!=='ब')cs++;document.querySelector('#p').textContent=ps;document.querySelector('#c').textContent=cs;document.querySelector('#r').textContent=`तपाईं ${p} — Computer ${c} · ${t}`})</script></body></html>
