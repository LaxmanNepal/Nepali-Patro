<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧠 मेमोरी म्याच — नेपाली पात्रो</title><style>body{margin:0;background:#f7f8fa;font-family:system-ui,sans-serif}.g{max-width:650px;margin:auto;padding:30px 12px}.card{text-align:center;background:#fff;border:1px solid #e4e7ec;border-radius:26px;padding:24px;box-shadow:0 12px 35px #10182812}h1{font-size:clamp(32px,8vw,54px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:500px;margin:20px auto}.x{aspect-ratio:1;border:0;border-radius:15px;background:#b91c1c;color:#fff;font-size:32px;cursor:pointer}.open{background:#fff1f2;color:#171717}.matched{background:#d1fadf;color:#067647}.btn{border:0;border-radius:12px;padding:11px 17px;background:#b91c1c;color:#fff;font-weight:900}.back{display:block;margin-top:18px;color:#b91c1c;font-weight:800;text-decoration:none}</style></head><body><main class="g"><div class="card"><div>🎮 नेपाली पात्रो गेम्स</div><h1>🧠 मेमोरी म्याच</h1><div id="moves">चाल: 0</div><div class="grid" id="g"></div><button class="btn" id="new">नयाँ खेल</button><a class="back" href="../">← सबै खेलहरू</a></div></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script><script>const icons=['🍎','🍌','🍇','🍉','🥝','🍒','🥕','🌽'];let a,open=[],matched=[],lock=false,moves=0;const el=document.querySelector('#g');function start(){a=[...icons,...icons].sort(()=>Math.random()-.5);open=[];matched=[];lock=false;moves=0;render()}function render(){el.innerHTML=a.map((v,i)=>`<button class="x ${open.includes(i)?'open':''} ${matched.includes(i)?'matched':''}" data-i="${i}">${open.includes(i)||matched.includes(i)?v:'?'}</button>`).join('');document.querySelector('#moves').textContent=`चाल: ${moves}`;el.querySelectorAll('button').forEach(b=>b.onclick=()=>flip(+b.dataset.i))}function flip(i){if(lock||open.includes(i)||matched.includes(i))return;open.push(i);render();if(open.length===2){moves++;const[x,y]=open;if(a[x]===a[y]){matched.push(x,y);open=[];render();if(matched.length===a.length)document.querySelector('#moves').textContent=`🎉 सबै मिल्यो! चाल: ${moves}`}else{lock=true;setTimeout(()=>{open=[];lock=false;render()},650)}}}document.querySelector('#new').onclick=start;start()</script></body></html>
