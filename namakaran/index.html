<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="जन्म विवरणका आधारमा नामकरणका लागि प्रारम्भिक अक्षर र नाम सुझाव व्यवस्थित गर्ने पृष्ठ।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>नामकरण सुझाव — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>नामकरण सुझाव</h1><p>जन्म विवरणका आधारमा नामकरणका लागि प्रारम्भिक अक्षर र नाम सुझाव व्यवस्थित गर्ने पृष्ठ।</p></section><section class="grid"><div class="card"><h2>नाम खोज्नुहोस्</h2><label>पहिलो अक्षर</label><select id="letter"><option>अ</option><option>आ</option><option>क</option><option>ख</option><option>ग</option><option>स</option><option>र</option></select><label>लिङ्ग</label><select id="gender"><option>छोरा</option><option>छोरी</option><option>दुवै</option></select><button onclick="names()">सुझाव हेर्नुहोस्</button></div><div class="card"><h2>सुझाव</h2><div id="names" class="list muted">अक्षर छान्नुहोस्।</div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>const db={अ:['अंश','अभय','अर्पण','अदिति','अञ्जली'],आ:['आरव','आदित्य','आस्था','आर्या','आकृति'],क:['कुशल','करण','काव्या','कृतिका','किरण'],ख:['खुसी','खेम','खगेन्द्र','खुश्बु'],ग:['गौरव','गगन','गौरी','गीता'],स:['समीर','सुमन','सृष्टि','सन्ध्या'],र:['रोशन','राहुल','रचना','राधिका']};function names(){const a=document.getElementById('letter').value;set('names',db[a].map(x=>'<div class="item">✨ '+x+'</div>').join(''))}</script></body></html>
