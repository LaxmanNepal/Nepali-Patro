<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="नेपाली पात्रोभित्रको सरल गणना उपकरण।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>क्यालकुलेटर — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>क्यालकुलेटर</h1><p>नेपाली पात्रोभित्रको सरल गणना उपकरण।</p></section><section class="grid"><div class="card"><h2>गणना गर्नुहोस्</h2><input id="expr" placeholder="जस्तै: (2500 * 12) / 100"><button onclick="calc()">गणना</button><div id="out" class="result">उत्तर यहाँ देखिन्छ</div></div><div class="card"><h2>छिटो गणना</h2><div class="list"><button class="secondary" onclick="quick('100+100')">100 + 100</button><button class="secondary" onclick="quick('5000*0.13')">13% of 5000</button></div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>function calc(){try{const x=document.getElementById('expr').value;if(!/^[0-9+\-*/().%\s]+$/.test(x))throw 0;set('out',String(Function('"use strict";return ('+x+')')()));}catch(e){set('out','मान्य गणितीय अभिव्यक्ति लेख्नुहोस्।')}}function quick(x){document.getElementById('expr').value=x;calc()}</script></body></html>
