name: Daily Rashifal Sync

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch and validate Rashifal
        run: python scripts/fetch_rashifal.py
      - name: Commit daily data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rashifal/
          git diff --cached --quiet || git commit -m "chore: sync daily Rashifal"
          git push
