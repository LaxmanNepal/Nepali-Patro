name: Platform Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Platform audit
        run: node scripts/platform_audit.mjs
      - name: Existing validation
        run: npm run validate:all
      - name: Python syntax audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do python -m py_compile "$file"; done < <(find scripts backend -type f -name '*.py' -print0)
