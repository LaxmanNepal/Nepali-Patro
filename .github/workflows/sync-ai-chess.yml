name: Sync AI Chess Source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream AI Chess
        run: |
          set -euo pipefail
          mkdir -p games/AI-Chess/vendor
          curl -fsSL https://raw.githubusercontent.com/Sop20Games/ai-chess/main/index.html -o games/AI-Chess/vendor/game.html
          curl -fsSL https://raw.githubusercontent.com/Sop20Games/ai-chess/main/style.css -o games/AI-Chess/vendor/style.css
          curl -fsSL https://raw.githubusercontent.com/Sop20Games/ai-chess/main/script.js -o games/AI-Chess/vendor/script.js

      - name: Commit synchronized source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/AI-Chess/vendor
          if git diff --cached --quiet; then
            echo 'AI Chess source is already up to date.'
            exit 0
          fi
          git commit -m 'chore: sync AI Chess source'
          git push
