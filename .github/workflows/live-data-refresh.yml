name: Nepali Patro Live Data Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: nepali-patro-main-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      # Dataset refreshes are isolated so one upstream outage does not stop
      # unrelated feeds. The status report below makes failures visible.
      - id: daily_rashifal
        name: Refresh daily Rashifal
        continue-on-error: true
        run: python scripts/fetch_rashifal.py
      - id: weekly_rashifal
        name: Refresh weekly Rashifal
        continue-on-error: true
        run: python scripts/fetch_weekly_rashifal.py
      - id: bank_rates
        name: Refresh bank rates
        continue-on-error: true
        run: |
          python scripts/interest_rate_fetcher.py
          python scripts/test_interest_rate_pipeline.py
          python scripts/generate_interest_rate_pages.py
      - id: forex
        name: Refresh NRB forex
        continue-on-error: true
        run: python scripts/update_forex.py
      - id: gold_silver
        name: Refresh gold and silver
        continue-on-error: true
        run: |
          python scripts/update_gold_rates.py
          python scripts/snapshot_gold_daily.py
      - id: itihas
        name: Refresh Itihas
        continue-on-error: true
        run: python scripts/update_history.py

      - name: Report refresh status
        if: always()
        env:
          DAILY: ${{ steps.daily_rashifal.outcome }}
          WEEKLY: ${{ steps.weekly_rashifal.outcome }}
          BANK: ${{ steps.bank_rates.outcome }}
          FOREX: ${{ steps.forex.outcome }}
          GOLD: ${{ steps.gold_silver.outcome }}
          ITIHAS: ${{ steps.itihas.outcome }}
        run: |
          {
            echo '## Live dataset refresh status'
            echo '| Dataset | Result |'
            echo '|---|---|'
            echo "| Daily Rashifal | ${DAILY} |"
            echo "| Weekly Rashifal | ${WEEKLY} |"
            echo "| Bank rates | ${BANK} |"
            echo "| NRB forex | ${FOREX} |"
            echo "| Gold/silver | ${GOLD} |"
            echo "| Itihas | ${ITIHAS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate every dataset
        run: python scripts/validate_all_datasets.py
      - name: Generate health report
        run: python scripts/data-health-report.py
      - name: Run core contract tests
        run: node tests/data-contracts.mjs

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data feeds interest-rate data-health.json
          if git diff --cached --quiet; then echo 'No data changes.'; exit 0; fi
          git commit -m 'chore: refresh Nepali Patro live datasets'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
