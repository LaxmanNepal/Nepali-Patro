name: Sync Nepal Local Governments

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync 753 local governments from MoFAGA
        run: node scripts/sync-mofaga-local-governments.mjs
      - name: Commit generated directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nepal-goverment/data/local-governments.js
          git diff --cached --quiet || git commit -m 'chore: sync local government directory'
          git push
