name: Update Kalimati Vegetable Prices
on:
  schedule:
    - cron: '15 1,7,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Kalimati market
        run: python scripts/scrape_vegetables.py
      - name: Commit updated prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vegetables.json
          git diff --cached --quiet || git commit -m 'chore: update Kalimati vegetable prices'
          git push
