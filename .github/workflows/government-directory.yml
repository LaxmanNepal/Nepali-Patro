name: Government Directory Check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync 753 local governments from MoFAGA
        run: node scripts/sync-local-governments.mjs
      - name: Check government websites
        run: node scripts/check-government-sites.mjs
      - name: Commit directory and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nepal-goverment/data/local-governments.js nepal-goverment/data/site-status.json
          git diff --cached --quiet || git commit -m 'chore: sync government directory and site status'
          git push
