name: Update NRB Forex Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0-6'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Sync official NRB rates
        run: python scripts/update_forex.py
      - name: Commit local feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/forex.json
          git diff --cached --quiet || git commit -m 'chore: update NRB forex feed'
          git pull --rebase origin main
          git push origin HEAD:main
