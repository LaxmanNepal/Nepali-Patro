name: Daily Rashifal Sync

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_rashifal.py'
      - '.github/workflows/rashifal.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch today's Rashifal
        run: python scripts/fetch_rashifal.py

      - name: Commit today's Rashifal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rashifal/
          git diff --cached --quiet || git commit -m "Update daily Rashifal"
          git push
