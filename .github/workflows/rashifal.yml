name: Daily Rashifal Sync

on:
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_rashifal.py'
      - '.github/workflows/rashifal.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch today's Rashifal
        run: python scripts/fetch_rashifal.py

      - name: Validate all 12 signs
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          d = datetime.now(ZoneInfo('Asia/Kathmandu')).date().isoformat()
          p = Path('data/rashifal') / f'{d}.json'
          assert p.exists(), f'Missing {p}'
          j = json.loads(p.read_text(encoding='utf-8'))
          assert len(j.get('signs', [])) == 12
          assert len({x.get('id') for x in j['signs']}) == 12
          assert all(x.get('prediction') for x in j['signs'])
          print(f'Validated {d}: 12 unique signs')
          PY

      - name: Commit today's Rashifal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rashifal/
          git diff --cached --quiet || git commit -m "Update daily Rashifal"
          git push
