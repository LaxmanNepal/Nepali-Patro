name: Rashifal Sync

on:
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_rashifal.py'
      - 'scripts/fetch_weekly_rashifal.py'
      - '.github/workflows/rashifal.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch today's daily Rashifal
        run: python scripts/fetch_rashifal.py

      - name: Fetch current weekly Rashifal
        run: python scripts/fetch_weekly_rashifal.py

      - name: Validate daily and weekly data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Asia/Kathmandu'))
          daily = Path('data/rashifal') / f'{now.date().isoformat()}.json'
          assert daily.exists(), f'Missing {daily}'
          d = json.loads(daily.read_text(encoding='utf-8'))
          assert len(d.get('signs', [])) == 12
          assert len({x.get('id') for x in d['signs']}) == 12
          assert all(x.get('prediction') for x in d['signs'])

          week_start = now.date().isoformat()
          from datetime import timedelta
          week_start = (now.date() - timedelta(days=now.weekday())).isoformat()
          weekly = Path('data/rashifal-weekly') / f'{week_start}.json'
          assert weekly.exists(), f'Missing {weekly}'
          w = json.loads(weekly.read_text(encoding='utf-8'))
          assert len(w.get('signs', [])) == 12
          assert len({x.get('id') for x in w['signs']}) == 12
          assert all(x.get('prediction') for x in w['signs'])
          print(f'Validated daily {daily.name} and weekly {weekly.name}')
          PY

      - name: Commit Rashifal snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rashifal/ data/rashifal-weekly/
          git diff --cached --quiet || git commit -m "Update daily and weekly Rashifal"
          git push
