name: Generate Nepali Patro Data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-calendar.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nepali-patro-writers
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate BS 2040-2100 calendar and Panchang
        run: npm run generate
      - name: Generate compatibility aliases
        run: npm run generate:routes
      - name: Syntax-check and validate
        run: |
          set -euo pipefail
          find js scripts -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          npm run validate
      - name: Commit generated data safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ patro/ calendar/ panchanga/ panchang/ parba/ festivals/ saith/ saait/ rashifal/ news/ converter/ scripts/ package.json package-lock.json
          if git diff --cached --quiet; then echo 'No generated changes.'; exit 0; fi
          git commit -m 'data: generate 2040-2100 calendar and Panchang'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
