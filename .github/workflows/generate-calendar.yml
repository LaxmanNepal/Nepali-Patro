name: Generate Nepali Patro 2083 Data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_2083.mjs'
      - 'package.json'
      - '.github/workflows/generate-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate complete 2083 data
        run: npm run generate:2083
      - name: Validate 365 days
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('data/calendar/2083.json','utf8')); if(x.days.length!==365) throw new Error('Expected 365 days, got '+x.days.length); const keys=new Set(x.days.map(d=>d.ad.date)); if(keys.size!==365) throw new Error('Duplicate AD dates'); if(x.days.some(d=>!d.bs?.day||!d.ad?.date||!d.weekday?.nepali)) throw new Error('Incomplete date record'); console.log('Validated 365 unique, complete days');"
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar/2083.json
          git diff --cached --quiet || git commit -m 'data: generate complete 2083 calendar and panchang'
          git push
