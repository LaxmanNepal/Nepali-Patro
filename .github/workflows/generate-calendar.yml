name: Generate Nepali Patro Data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/generate-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Generate calendar and Panchang data
        run: npm run generate

      - name: Validate generated data
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const idx=JSON.parse(fs.readFileSync('data/years.json','utf8'));
          if(idx.minYear!==2040 || idx.maxYear!==2100 || idx.years.length!==61) throw new Error('Expected BS 2040-2100');
          let total=0;
          for(const y of idx.years){
            const x=JSON.parse(fs.readFileSync(`data/calendar/${y.year}.json`,'utf8'));
            if(x.days.length!==y.days) throw new Error(`Day mismatch ${y.year}`);
            const bs=new Set(x.days.map(d=>`${d.bs.year}-${d.bs.month}-${d.bs.day}`));
            const ad=new Set(x.days.map(d=>d.ad.date));
            if(bs.size!==x.days.length || ad.size!==x.days.length) throw new Error(`Duplicate date ${y.year}`);
            if(x.days.some(d=>!d.bs?.year || !d.bs?.month || !d.bs?.day || !d.ad?.date || !d.weekday)) throw new Error(`Incomplete date record ${y.year}`);
            total+=x.days.length;
          }
          const c=JSON.parse(fs.readFileSync('data/conversion-index.json','utf8'));
          if(c.items.length!==total) throw new Error('Conversion index mismatch');
          console.log(`Validated ${idx.years.length} BS years and ${total} dates.`);
          NODE

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ scripts/ package.json package-lock.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'data: generate 2040-2100 calendar and Panchang'
          git push
