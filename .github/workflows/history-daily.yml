name: Daily Nepali History Research

on:
  workflow_dispatch:
  schedule:
    - cron: "45 18 * * *"

permissions:
  contents: write

concurrency:
  group: nepali-patro-main-writer
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Research today's history
        run: python scripts/update_history.py
      - name: Validate daily history files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo
          root = pathlib.Path("data/itihas")
          files = list(root.glob("*/*.json"))
          assert files, "No daily history files found"
          for p in files:
              d = json.loads(p.read_text(encoding="utf-8"))
              assert isinstance(d, dict), p
              assert isinstance(d.get("events", []), list), p
          today = datetime.now(ZoneInfo("Asia/Kathmandu")).strftime("%Y-%m-%d")
          today_files = []
          for p in files:
              d = json.loads(p.read_text(encoding="utf-8"))
              if d.get("ad_date") == today: today_files.append((p, d))
          assert len(today_files) == 1, f"Expected exactly one history file for {today}, found {len(today_files)}"
          today_path, d = today_files[0]
          for key in ("events", "births", "deaths", "research_leads"):
              assert isinstance(d.get(key), list), today_path
          assert d.get("bs_year") and d.get("bs_month") and d.get("bs_day"), today_path
          assert d.get("last_researched"), "Today's file has no research timestamp"
          assert d.get("research", {}).get("status") == "automated daily research"
          assert d.get("research", {}).get("reference_sources_checked", 0) >= 1
          print(f"Validated {len(files)} daily history files")
          print(f"Today's file: {today_path}")
          PY
      - name: Commit daily research
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/itihas
          if git diff --cached --quiet; then echo "No history changes to commit."; exit 0; fi
          git commit -m "chore: daily Nepali history research"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
