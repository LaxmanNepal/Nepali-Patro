name: Update official Nepal gold rates
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Collect NEGOSIDA homepage rates
        run: python scripts/update_gold_rates.py
      - name: Commit updated rates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gold-price.json
          git diff --cached --quiet || git commit -m 'chore: update official gold rates'
          git pull --rebase origin main
          git push origin main
