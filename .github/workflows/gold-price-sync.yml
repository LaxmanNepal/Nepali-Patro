name: Sync Official Gold & Silver Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: gold-price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Fetch and validate official NEGOSIDA rates
        run: python scripts/update_gold_rates.py

      - name: Build normalized daily history database
        run: python scripts/normalize_gold_history.py

      - name: Generate rolling history statistics
        run: python scripts/gold_history_stats.py

      - name: Strict feed health validation
        run: python scripts/validate_gold_feed.py

      - name: Validate normalized history database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/gold-price-history.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('schema') != 'gold-price-history/v1': raise SystemExit('Invalid history schema')
          records=d.get('records',[])
          if d.get('recordCount') != len(records): raise SystemExit('recordCount mismatch')
          dates=[r.get('date_ad') for r in records]
          if dates != sorted(set(dates)): raise SystemExit('History dates are not unique/sorted')
          required=['fine_gold_tola','gold_22k_tola','silver_tola','fine_gold_10g','gold_22k_10g','silver_10g']
          for r in records:
              if set(r.get('prices',{})) != set(required): raise SystemExit(f'Bad price schema: {r}')
              if set(r.get('availability',{})) != set(required): raise SystemExit(f'Bad availability schema: {r}')
          s=Path('data/gold-price-stats.json')
          sd=json.loads(s.read_text(encoding='utf-8'))
          if sd.get('schema') != 'gold-price-stats/v1': raise SystemExit('Invalid stats schema')
          for window in ('7','30','90','365'):
              if window not in sd.get('windows',{}): raise SystemExit(f'Missing stats window {window}')
          print(f'Normalized history OK: {len(records)} daily records')
          PY

      - name: Detect stale source publication
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          d=json.loads(Path('feeds/gold_silver.json').read_text(encoding='utf-8'))
          source=date.fromisoformat(d['date_ad'])
          age=(date.today()-source).days
          print(f'Source publication age: {age} day(s)')
          if age > 7:
              raise SystemExit('Official source data is older than 7 days; refusing deployment')
          PY

      - name: Commit changed price data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/gold_silver.json data/gold-price.json data/gold-price-history.json data/gold-price-stats.json
          if git diff --cached --quiet; then
            echo 'No gold/silver data change.'
            exit 0
          fi
          git commit -m 'chore: update gold price database'
          git pull --rebase origin main
          git push origin HEAD:main
