name: Sync Official Gold & Silver Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: gold-price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Fetch and validate official NEGOSIDA rates
        run: python scripts/update_gold_rates.py

      - name: Strict feed health validation
        run: python scripts/validate_gold_feed.py

      - name: Detect stale source publication
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          d=json.loads(Path('feeds/gold_silver.json').read_text(encoding='utf-8'))
          source=date.fromisoformat(d['date_ad'])
          age=(date.today()-source).days
          print(f'Source publication age: {age} day(s)')
          if age > 7:
              raise SystemExit('Official source data is older than 7 days; refusing deployment')
          PY

      - name: Commit changed price data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/gold_silver.json data/gold-price.json
          if git diff --cached --quiet; then
            echo 'No gold/silver price change.'
            exit 0
          fi
          git commit -m 'chore: update official gold and silver prices'
          git pull --rebase origin main
          git push origin HEAD:main
