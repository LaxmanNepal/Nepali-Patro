name: Build Local Government Directory

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build 753 local government directory
        run: node scripts/build-local-governments.mjs
      - name: Commit generated directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nepal-goverment/data/local-governments.json
          git diff --cached --quiet || git commit -m 'chore: refresh local government directory'
          git push
