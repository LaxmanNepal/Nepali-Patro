name: Sync Nepali Patro Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: nepali-patro-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Collect NEPSE published JSON data
        run: python scripts/sync_nepse_data.py
      - name: Collect critical financial feeds
        run: |
          python scripts/update_forex.py
          python scripts/update_gold_rates.py
          python scripts/update_petroleum_prices.py
      - name: Collect fresh news feed
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/update_news.py; then exit 0; fi
            echo "News sync attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo 'News sync failed after 3 attempts.'
          exit 1
      - name: Collect optional feeds
        continue-on-error: true
        run: |
          python scripts/update_reddit.py || true
          python scripts/update_memes.py || true
      - name: Validate generated data
        run: npm run validate:all
      - name: Commit all feed changes once
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds data
          if git diff --cached --quiet; then echo 'No data changes.'; exit 0; fi
          git fetch origin main
          git rebase origin/main
          git add feeds data
          if git diff --cached --quiet; then echo 'No data changes after rebase.'; exit 0; fi
          git commit -m 'chore: update Nepali Patro data feeds'
          git push origin HEAD:main
