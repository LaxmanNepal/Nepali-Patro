name: Sync Nepali Patro Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: nepali-patro-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Collect critical financial feeds
        run: |
          set -euo pipefail
          python scripts/update_forex.py
          python scripts/update_gold_rates.py
          python scripts/update_petroleum_prices.py

      - name: Collect optional feeds
        continue-on-error: true
        run: |
          python scripts/update_reddit.py || true
          python scripts/update_memes.py || true
          python scripts/update_news.py || true

      - name: Validate feed producers
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_forex.py scripts/update_gold_rates.py scripts/update_petroleum_prices.py scripts/update_news.py scripts/update_reddit.py scripts/update_memes.py

      - name: Validate generated data
        run: npm run validate:all

      - name: Commit all feed changes once
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds data
          if git diff --cached --quiet; then
            echo 'No feed changes.'
            exit 0
          fi
          git fetch origin main
          git rebase origin/main
          git add feeds data
          if git diff --cached --quiet; then
            echo 'No feed changes after rebase.'
            exit 0
          fi
          git commit -m 'chore: update Nepali Patro data feeds'
          git push origin HEAD:main
