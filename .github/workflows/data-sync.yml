name: Sync Nepali Patro Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nepali-patro-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Collect Nepali news from centralized feeds.js
        run: python scripts/update_news.py

      - name: Collect build-time Reddit stories
        run: python scripts/update_reddit.py

      - name: Generate original Nepali meme cards
        run: python scripts/update_memes.py

      - name: Sync official NRB forex rates
        run: python scripts/update_forex.py

      - name: Sync official Nepal gold and silver rates
        run: python scripts/update_gold_rates.py

      - name: Validate feed producers
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_news.py scripts/update_reddit.py scripts/update_memes.py scripts/update_forex.py scripts/update_gold_rates.py

      - name: Validate generated local feeds
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run validate:data

      - name: Commit all feed changes once
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/news.json data/news.json feeds/reddit.json feeds/memes.json feeds/forex.json feeds/gold_silver.json
          if git diff --cached --quiet; then
            echo 'No feed changes.'
            exit 0
          fi
          git commit -m 'chore: update Nepali Patro feeds'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
