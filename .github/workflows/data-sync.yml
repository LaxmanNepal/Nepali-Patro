name: Sync Nepali Patro Data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: nepali-patro-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Collect NEPSE data
        run: python scripts/sync_nepse_data.py
      - name: Build normalized company database
        run: python scripts/build_nepse_companies.py
      - name: Validate NEPSE snapshot
        run: python backend/nepse/validate_snapshot.py
      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nepse')
          for name in ['nepse_data.json','market/live.json','market/status.json','market/indices.json','market/summary.json']:
              f=p/name
              if not f.exists(): raise SystemExit(f'Missing {f}')
              json.loads(f.read_text(encoding='utf-8'))
          companies=list((p/'companies').glob('*.json')) if (p/'companies').exists() else []
          if len(companies)<10: raise SystemExit(f'Too few company files: {len(companies)}')
          print('Validated',len(companies),'company JSON files')
          PY
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nepse
          if git diff --cached --quiet; then echo 'No NEPSE data changes'; exit 0; fi
          git commit -m 'chore: update NEPSE market and company data'
          git pull --rebase origin main
          git push origin HEAD:main
