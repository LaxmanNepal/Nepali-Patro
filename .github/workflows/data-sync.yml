name: Sync Nepali Patro Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nepali-patro-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Collect Nepali news from centralized feeds.js
        id: news
        run: python scripts/update_news.py

      - name: Validate and publish news feed immediately
        if: steps.news.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p=json.load(open('feeds/news.json',encoding='utf-8'))
          if not p.get('items'): raise SystemExit('news.json has no items')
          if len(p['items']) < 20: print(f"WARNING: only {len(p['items'])} news items collected")
          newest=p.get('newestPublishedTime')
          if newest:
              age=(datetime.now(timezone.utc)-datetime.fromisoformat(newest.replace('Z','+00:00'))).total_seconds()/3600
              print(f'Newest article age: {age:.2f}h')
              if age > 24: print('WARNING: newest article is older than 24 hours')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/news.json data/news.json
          if git diff --cached --quiet; then
            echo 'News feed unchanged.'
          else
            git commit -m 'chore: update Nepali news feed'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Collect build-time Reddit stories
        continue-on-error: true
        run: python scripts/update_reddit.py

      - name: Generate original Nepali meme cards
        continue-on-error: true
        run: python scripts/update_memes.py

      - name: Sync official NRB forex rates
        continue-on-error: true
        run: python scripts/update_forex.py

      - name: Sync official Nepal gold and silver rates
        continue-on-error: true
        run: python scripts/update_gold_rates.py

      - name: Sync official Nepal petroleum prices
        continue-on-error: true
        run: python scripts/update_petroleum_prices.py

      - name: Validate feed producers
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_news.py scripts/update_reddit.py scripts/update_memes.py scripts/update_forex.py scripts/update_gold_rates.py scripts/update_petroleum_prices.py

      - name: Validate generated local feeds
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run validate:data

      - name: Commit remaining feed changes once
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/news.json data/news.json feeds/reddit.json feeds/memes.json feeds/forex.json feeds/gold_silver.json feeds/petroleum_prices.json
          if git diff --cached --quiet; then
            echo 'No remaining feed changes.'
            exit 0
          fi
          git fetch origin main
          git rebase origin/main
          git add feeds/news.json data/news.json feeds/reddit.json feeds/memes.json feeds/forex.json feeds/gold_silver.json feeds/petroleum_prices.json
          if git diff --cached --quiet; then
            echo 'No remaining feed changes after rebase.'
            exit 0
          fi
          git commit -m 'chore: update Nepali Patro data feeds'
          git push origin HEAD:main
