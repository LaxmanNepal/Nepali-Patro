name: Sync NRB Forex
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync official NRB rates
        run: node scripts/sync-forex.js
      - name: Commit local feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/forex.json
          git diff --cached --quiet || git commit -m 'chore: update NRB forex rates'
          git pull --rebase origin main
          git push origin HEAD:main