name: Deploy Nepali Patro

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nepali-patro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate BS 2040-2100 calendar + Panchang data
        run: npm run generate
      - name: Generate all clean feature routes
        run: npm run generate:routes
      - name: Generate public SEO sitemap
        run: npm run generate:sitemap
      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          python3 -m py_compile scripts/update_history.py
      - name: Validate core generated site
        run: npm run validate
      - name: Validate interest-rate feature
        shell: bash
        run: |
          set -euo pipefail
          test -f interest-rate/index.html
          test -f interest-rate/llms.txt
          test -f feeds/interest_rates/current.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('feeds/interest_rates/current.json').read_text(encoding='utf-8'))
          assert d.get('country') == 'Nepal'
          html=Path('interest-rate/index.html').read_text(encoding='utf-8')
          assert 'नेपालका बैंकहरूको ब्याजदर' in html
          banks=d.get('banks')
          if not isinstance(banks, list): raise SystemExit('Interest-rate feed banks must be a list')
          if d.get('status') == 'awaiting_first_live_run' and not banks:
              print('Interest-rate feature is awaiting its first live run; allowing Pages deployment.')
          elif not d.get('updatedAt'):
              raise SystemExit('Interest-rate feed has no updatedAt after live data was expected')
          print(f"Interest-rate validation passed: {len(banks)} bank records")
          PY
      - name: Validate history dataset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('data/itihas').glob('*/*.json'))
          if not files: raise SystemExit('No history JSON files found')
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              for key in ('events','births','deaths'):
                  if not isinstance(d.get(key),list): raise SystemExit(f'{p}: {key} must be a list')
              if 'research_leads' in d and not isinstance(d['research_leads'],list):
                  raise SystemExit(f'{p}: research_leads must be a list when present')
              if not isinstance(d.get('bs_year'),int): raise SystemExit(f'{p}: missing/invalid bs_year')
              if not isinstance(d.get('bs_month'),int): raise SystemExit(f'{p}: missing/invalid bs_month')
              if not isinstance(d.get('bs_day'),int): raise SystemExit(f'{p}: missing/invalid bs_day')
              if not (1 <= d['bs_month'] <= 12 and 1 <= d['bs_day'] <= 32): raise SystemExit(f'{p}: invalid BS date')
          print(f'History dataset passed: {len(files)} files')
          PY
      - name: Validate local news feed schema
        run: |
          python3 -m py_compile scripts/update_news.py scripts/update_forex.py scripts/update_gold_rates.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('feeds/news.json').read_text(encoding='utf-8'))
          items=d.get('items',[]) if isinstance(d,dict) else d
          if not items: raise SystemExit('feeds/news.json contains no articles')
          required={'title','description','imageUrl','sourceLogo','sourceName','publishedTime','articleUrl'}
          for i,item in enumerate(items):
              missing=required-set(item)
              if missing: raise SystemExit(f'feeds/news.json item {i} missing: {sorted(missing)}')
          print(f'Local news schema passed: {len(items)} articles')
          PY
      - name: Prepare clean Pages artifact
        env:
          PAGES_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' --exclude 'scripts/' --exclude 'package.json' --exclude 'package-lock.json' --exclude 'README.md' ./ _site/
          node scripts/apply_shared_shell.mjs _site
          test -f _site/index.html
          test -f _site/sitemap.xml
          for r in calendar panchanga parba saith rashifal news converter forex gold-price itihas-aaja interest-rate; do test -f "_site/$r/index.html"; done
          test -f _site/interest-rate/llms.txt
          test -f _site/feeds/interest_rates/current.json
          test -f _site/data/years.json
          test -f _site/data/conversion-index.json
          test -f _site/partials/header.html
          test -f _site/partials/footer.html
          test -f _site/js/shared-shell.js
          test -f _site/css/shared-shell.css
          test -f _site/feeds/news.json
          test -f _site/feeds/forex.json
          test -f _site/feeds/gold_silver.json
          grep -q 'interest-rate/' _site/partials/header.html
          grep -q 'बैंक ब्याजदर' _site/partials/header.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
