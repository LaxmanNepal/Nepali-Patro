name: Deploy Nepali Patro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nepali-patro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate BS 2040-2100 calendar + Panchang data
        run: npm run generate

      - name: Generate all clean feature routes
        run: npm run generate:routes

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find js scripts -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Validate generated site and dataset
        run: npm run validate

      - name: Validate news JSON
        run: |
          python3 -m py_compile scripts/update_news.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/news.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              items=d if isinstance(d,list) else d.get('items',[])
              for item in items:
                  if not item.get('title') or not item.get('link'):
                      raise SystemExit('Invalid news item')
          print('News JSON validation passed.')
          PY

      - name: Prepare clean Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'scripts/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'README.md' \
            ./ _site/
          node scripts/apply_shared_shell.mjs _site
          test -f _site/index.html
          for r in patro calendar panchanga panchang parba festivals saith saait rashifal news converter; do test -f "_site/$r/index.html"; done
          test -f _site/data/years.json
          test -f _site/data/conversion-index.json
          test -f _site/partials/header.html
          test -f _site/partials/footer.html
          test -f _site/js/shared-shell.js
          test -f _site/css/shared-shell.css

      - name: Verify shared header and footer on every HTML page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('_site')
          htmls=list(root.rglob('*.html'))
          if not htmls:
              raise SystemExit('No HTML pages found')
          for p in htmls:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'css/shared-shell.css' not in s or 'js/shared-shell.js' not in s:
                  raise SystemExit(f'Shared shell missing: {p}')
          print(f'Shared shell verified on {len(htmls)} HTML pages.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
