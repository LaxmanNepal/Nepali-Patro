name: Deploy Nepali Patro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install data engine
        run: npm install --no-audit --no-fund
      - name: Generate complete 2083 calendar dataset
        run: npm run generate:2083
      - name: Validate required files and dataset
        run: |
          test -f index.html
          test -f css/main.css
          test -f css/patro-enhancements.css
          test -f js/app.js
          test -f js/news.js
          test -f manifest.json
          test -f sw.js
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('data/calendar/2083.json','utf8')); if(x.days.length!==365) throw new Error('Expected 365 days'); if(new Set(x.days.map(d=>d.ad.date)).size!==365) throw new Error('Duplicate dates'); console.log('2083 dataset OK:',x.days.length,'days');"
      - name: Remove build-only dependencies
        run: rm -rf node_modules package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
