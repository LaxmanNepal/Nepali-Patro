name: Deploy Nepali Patro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install data engine
        run: npm install --no-audit --no-fund
      - name: Generate BS 2040-2100 calendar + Panchang data
        run: npm run generate
      - name: Generate clean feature routes
        run: npm run generate:routes
      - name: Validate 61-year dataset
        run: |
          test -f index.html
          test -f css/main.css
          test -f css/patro-enhancements.css
          test -f js/app.js
          test -f js/news.js
          test -f manifest.json
          test -f sw.js
          node - <<'NODE'
          const fs=require('fs');
          const idx=JSON.parse(fs.readFileSync('data/years.json','utf8'));
          if(idx.minYear!==2040 || idx.maxYear!==2100 || idx.years.length!==61) throw new Error('Expected BS 2040-2100');
          let total=0;
          for(const y of idx.years){
            const x=JSON.parse(fs.readFileSync(`data/calendar/${y.year}.json`,'utf8'));
            if(x.days.length!==y.days) throw new Error(`Day mismatch ${y.year}`);
            if(new Set(x.days.map(d=>d.ad.date)).size!==x.days.length) throw new Error(`Duplicate AD date ${y.year}`);
            total+=x.days.length;
          }
          const c=JSON.parse(fs.readFileSync('data/conversion-index.json','utf8'));
          if(c.items.length!==total) throw new Error('Conversion index mismatch');
          console.log(`Validated ${idx.years.length} BS years and ${total} dates: ${idx.adStart} → ${idx.adEnd}`);
          NODE
          for r in patro panchanga parba saith rashifal news converter; do test -f "$r/index.html"; done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
