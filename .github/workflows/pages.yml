name: Deploy Nepali Patro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nepali-patro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate BS 2040-2100 calendar + Panchang data
        run: npm run generate

      - name: Generate all clean feature routes
        run: npm run generate:routes

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Validate generated site and all datasets
        run: npm run validate:all

      - name: Validate local news feed schema
        run: |
          python3 -m py_compile scripts/update_news.py scripts/update_forex.py scripts/update_gold_rates.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('feeds/news.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          items=d.get('items',[]) if isinstance(d,dict) else d
          if not items:
              raise SystemExit('feeds/news.json contains no articles')
          required={'title','description','imageUrl','sourceLogo','sourceName','publishedTime','articleUrl'}
          for i,item in enumerate(items):
              missing=required-set(item)
              if missing:
                  raise SystemExit(f'feeds/news.json item {i} missing: {sorted(missing)}')
          if isinstance(d,dict) and d.get('feedCount',0) < 1:
              raise SystemExit('feeds/news.json reports zero configured feeds')
          print(f"Local news schema passed: {len(items)} articles from {d.get('feedCount','?')} configured feeds; {d.get('failedFeeds','?')} failed on last sync")
          PY

      - name: Prepare clean Pages artifact
        env:
          PAGES_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'scripts/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'README.md' \
            ./ _site/
          node scripts/apply_shared_shell.mjs _site
          test -f _site/index.html
          for r in calendar panchanga parba saith rashifal news converter forex gold-price itihas-aaja; do test -f "_site/$r/index.html"; done
          test -f _site/data/years.json
          test -f _site/data/conversion-index.json
          test -f _site/partials/header.html
          test -f _site/partials/footer.html
          test -f _site/js/shared-shell.js
          test -f _site/css/shared-shell.css
          test -f _site/feeds/news.json
          test -f _site/feeds/forex.json
          test -f _site/feeds/gold_silver.json

      - name: Verify one shared shell and complete navigation on every HTML page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('_site')
          htmls=list(root.rglob('*.html'))
          header=(root/'partials/header.html').read_text(encoding='utf-8',errors='ignore')
          required=[
              'https://apps.laxmannepal.com.np/Nepali-Patro/calendar/',
              'https://apps.laxmannepal.com.np/Nepali-Patro/panchanga/',
              'https://apps.laxmannepal.com.np/Nepali-Patro/rashifal/',
              'https://apps.laxmannepal.com.np/Nepali-Patro/parba/',
              'https://apps.laxmannepal.com.np/Nepali-Patro/saith/',
              'https://apps.laxmannepal.com.np/Nepali-Patro/news/',
              'https://apps.laxmannepal.com.np/Nepali-Patro/forex/'
          ]
          if not htmls: raise SystemExit('No HTML pages found')
          for url in required:
              if url not in header:
                  raise SystemExit(f'Shared header is missing navigation link: {url}')
          for p in htmls:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'data-shared-build=' not in s or 'js/shared-shell.js?v=' not in s or 'css/shared-shell.css?v=' not in s:
                  raise SystemExit(f'Shared shell/version missing: {p}')
          print(f'Shared shell + complete nav verified on {len(htmls)} HTML pages.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
