name: Live TV Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_live_tv.py'
      - '.github/workflows/live-tv-health.yml'
      - 'data/live-tv-sources.json'

permissions:
  contents: write

concurrency:
  group: live-tv-health
  cancel-in-progress: true

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check remote Live TV catalog and streams
        run: python scripts/check_live_tv.py

      - name: Validate health snapshot
        run: python - <<'PY'
import json
from pathlib import Path
p=Path('data/live-tv-health.json')
d=json.loads(p.read_text(encoding='utf-8'))
assert d.get('version') == 3
assert isinstance(d.get('results'), list)
assert d.get('channelCount') == len(d['results'])
print(f"Checked {d['channelCount']} channels: {d['onlineCount']} online, {d['offlineCount']} offline")
PY

      - name: Commit health snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-tv-health.json
          git diff --cached --quiet || git commit -m 'chore: update live TV health snapshot'
          git push
