name: Promote Kundali
on: push
permissions:
  contents: write
jobs:
  promote:
    if: github.event.head_commit.message != 'ci(kundali): promote generated index'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp kundali/app.html kundali/index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kundali/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci(kundali): promote generated index'
          git push