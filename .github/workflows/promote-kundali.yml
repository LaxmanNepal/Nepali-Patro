name: Promote Kundali
on:
  push:
    paths:
      - 'kundali/app.html'
      - '.github/workflows/promote-kundali.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.event.head_commit.message != 'ci(kundali): promote generated index'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote app shell
        run: cp kundali/app.html kundali/index.html
      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kundali/index.html
          git diff --cached --quiet || git commit -m 'ci(kundali): promote generated index'
          git push