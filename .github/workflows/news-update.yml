name: Update Nepali News
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: nepali-patro-writers
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and normalize Nepali RSS feeds
        run: python scripts/update_news.py
      - name: Commit and push updated news safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if git diff --cached --quiet; then echo 'No news changes.'; exit 0; fi
          git commit -m 'chore: update Nepali news feed'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
