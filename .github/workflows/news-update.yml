name: Update Nepali News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: nepali-patro-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and normalize Nepali RSS feeds
        run: python scripts/update_news.py

      - name: Commit and push updated news safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if git diff --cached --quiet; then
            echo 'No news changes.'
            exit 0
          fi
          git commit -m 'chore: update Nepali news feed'

          # Calendar generation and news collection are independent scheduled jobs.
          # Retry the rebase/push so either job can safely land its commit if both
          # happen to update main at nearly the same time.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --soft HEAD~1; git add data/news.json; git commit -m 'chore: update Nepali news feed'; }
            if git push origin HEAD:main; then
              echo "News update pushed on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to push news update after 5 attempts.'
          exit 1
