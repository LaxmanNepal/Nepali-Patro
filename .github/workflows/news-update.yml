name: Update Nepali News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and normalize Nepali RSS feeds
        run: python scripts/update_news.py
      - name: Commit updated news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if git diff --cached --quiet; then
            echo 'No news changes.'
          else
            git commit -m 'chore: update Nepali news feed'
            git push
          fi
