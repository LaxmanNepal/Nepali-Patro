name: Update Nepali News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: nepali-patro-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and normalize Nepali RSS feeds
        run: python scripts/update_news.py

      - name: Commit and push updated news safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/news.json
          if git diff --cached --quiet; then
            echo 'No news changes.'
            exit 0
          fi

          git commit -m 'chore: update Nepali news feed'

          # The repository may receive commits from the calendar/data workflows
          # while this scheduled job is running. Rebase onto the latest main
          # before pushing so the generated news commit remains fast-forwardable.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
