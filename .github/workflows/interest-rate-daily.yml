name: Daily Nepal Bank Interest Rates

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/interest_rate_*.py'
      - '.github/workflows/interest-rate-daily.yml'
  schedule:
    - cron: '15 3 * * *'
    - cron: '15 9 * * *'

permissions:
  contents: write

concurrency:
  group: interest-rate-daily
  cancel-in-progress: false

jobs:
  update-interest-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Fetch and normalize live rates
        run: python scripts/interest_rate_fetcher.py

      - name: Run data quality gate
        run: python scripts/test_interest_rate_pipeline.py

      - name: Generate public interest-rate pages
        run: python scripts/generate_interest_rate_pages.py

      - name: Validate public assets
        run: |
          set -euo pipefail
          test -f interest-rate/index.html
          test -f feeds/interest_rates/current.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('feeds/interest_rates/current.json').read_text())
          assert data.get('updatedAt')
          assert isinstance(data.get('banks'), list) and data['banks']
          health = data.get('health', {})
          verified = sum(1 for bank in data['banks'] if bank.get('status') == 'verified' and bank.get('rates'))
          if health:
              assert health.get('verifiedBanks') == verified
          print('Dataset:', len(data['banks']), 'banks')
          print('Verified with usable rates:', verified)
          if verified == 0:
              print('WARNING: No live verified rates were extracted.')
          PY

      - name: Commit changed data and pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/interest_rates/ interest-rate/bank/ interest-rate/sitemap-interest-rates.xml
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'chore: update Nepal bank interest rates and pages'
          git push origin HEAD:${GITHUB_REF_NAME}
