<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#991b1b"><meta name="description" content="नेपाली समाचार — राष्ट्रिय, राजनीति, अर्थतन्त्र, प्रविधि, खेलकुद, मनोरञ्जन।"><title>समाचार केन्द्र — नेपाली पात्रो</title><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/main.css?v=20260824-02"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/shared-shell.css?v=20260824-02"><style>body{background:#fafafa}.news-page{max-width:1180px;margin:auto;padding:28px 16px 80px}.hero{background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;border-radius:24px;padding:28px;margin-bottom:18px}.hero h1{font-size:clamp(30px,5vw,46px);margin:7px 0}.hero p{max-width:760px;line-height:1.8;opacity:.9}.controls{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;position:sticky;top:74px;z-index:5;box-shadow:0 10px 30px rgba(15,23,42,.06)}.controls input,.controls select{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;background:#fff}.cats{display:flex;gap:8px;overflow:auto;margin:16px 0}.cats button{white-space:nowrap;padding:9px 14px;border:1px solid #ddd;background:#fff;border-radius:999px;cursor:pointer}.cats .active{background:#991b1b;color:#fff;border-color:#991b1b}.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.news-card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;overflow:hidden;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.news-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(15,23,42,.08)}.news-card img{width:100%;aspect-ratio:16/9;object-fit:cover}.count{margin:14px 0;color:#666}.empty,.news-empty{text-align:center;padding:40px;background:#fff;border-radius:16px}.load{display:block;margin:20px auto;padding:12px 20px;border:0;border-radius:10px;background:#991b1b;color:#fff;font-weight:700;cursor:pointer}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr;top:64px}.news-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.news-page{padding:18px 12px 60px}.hero{padding:22px 18px;border-radius:20px}.controls{grid-template-columns:1fr;top:58px}.news-grid{grid-template-columns:1fr}}</style></head><body><main class="news-page"><section class="hero"><small>स्वचालित स्थानीय फिड</small><h1>समाचार केन्द्र</h1><p>नेपालका विभिन्न समाचार स्रोतबाट GitHub Actions मार्फत नियमित रूपमा संकलित समाचार। नयाँ सामग्री आएपछि स्थानीय फिड अपडेट हुन्छ र यो पृष्ठले पनि स्वतः ताजा गर्छ।</p></section><section id="newsLiveStatus" class="news-live-bar" aria-live="polite"></section><section class="controls"><input id="newsSearch" placeholder="समाचार खोज्नुहोस्…"><select id="newsCategoryFilter"></select><select id="newsSourceFilter"><option value="all">सबै स्रोत</option></select><select id="newsSort"><option value="latest">नयाँ पहिले</option><option value="oldest">पुरानो पहिले</option></select></section><div class="cats" id="cats"></div><p id="newsCount" class="count">समाचार लोड हुँदैछ…</p><section id="newsGrid" class="news-grid"></section><button id="loadMoreNews" class="load" hidden>थप समाचार</button></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js?v=20260824-02"></script><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/news.js?v=20260824-04"></script><script>document.addEventListener('DOMContentLoaded',()=>{const root=document.getElementById('cats');root.innerHTML='<button class="active" data-news-cat="all">सबै</button><button data-news-cat="national">राष्ट्रिय</button><button data-news-cat="politics">राजनीति</button><button data-news-cat="business">अर्थतन्त्र</button><button data-news-cat="sports">खेलकुद</button><button data-news-cat="technology">प्रविधि</button><button data-news-cat="entertainment">मनोरञ्जन</button>';});</script></body></html>
