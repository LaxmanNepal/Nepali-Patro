<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c"><meta name="description" content="नेपाली पात्रो Meme Generator — फोटोमा नेपाली वा English meme text थप्नुहोस्, बनाउनुहोस् र share गर्नुहोस्।">
<title>Meme Generator — नेपाली पात्रो</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#171717;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px 14px 60px}.hero{text-align:center;margin:10px auto 25px}.pill{display:inline-block;background:#fff1f2;color:#b91c1c;border:1px solid #fecdd3;border-radius:999px;padding:7px 13px;font-weight:900;font-size:13px}.hero h1{font-size:clamp(36px,8vw,58px);margin:13px 0 8px;line-height:1}.hero p{color:#667085;margin:0 auto;max-width:680px;line-height:1.6}.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}.preview{background:#111827;border-radius:25px;padding:12px;position:sticky;top:14px}.canvas-wrap{background:#000;border-radius:17px;overflow:hidden;line-height:0}.canvas-wrap canvas{display:block;width:100%;height:auto}.upload{margin-top:10px;display:block;text-align:center;background:#fff;color:#111827;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.upload input{display:none}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:25px;padding:18px;box-shadow:0 10px 30px #10182810}.panel h2{margin:0 0 15px;font-size:21px}.field{margin:0 0 13px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px;color:#344054}.field input,.field select{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:inherit;outline:0}.field input:focus,.field select:focus{border-color:#b91c1c}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range{width:100%}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{background:#f2f4f7;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.btn{border:0;border-radius:13px;padding:13px 10px;font:inherit;font-weight:950;cursor:pointer}.primary{background:#b91c1c;color:#fff}.secondary{background:#f2f4f7;color:#101828}.ideas{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}.idea{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.share{margin-top:10px}.templates{margin-top:20px}.templates h2{font-size:21px}.template-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.template{border:1px solid #e4e7ec;background:#fff;border-radius:13px;padding:12px 7px;text-align:center;cursor:pointer;font-weight:850;font-size:13px}.template span{display:block;font-size:30px;margin-bottom:5px}.hint{text-align:center;color:#98a2b3;font-size:12px;margin-top:18px}@media(max-width:800px){.app{grid-template-columns:1fr}.preview{position:static}.panel{border-radius:20px}.template-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><span class="pill">😂 नेपाली पात्रो Meme Studio</span><h1>Meme बनाउनुहोस्</h1><p>आफ्नो फोटो upload गर्नुहोस्, text लेख्नुहोस्, customize गर्नुहोस् र तुरुन्त PNG download वा mobile मा share गर्नुहोस्।</p></section>
<section class="app">
<div class="preview"><div class="canvas-wrap"><canvas id="canvas" width="1080" height="1080"></canvas></div><label class="upload">📷 फोटो छान्नुहोस्<input id="file" type="file" accept="image/*"></label></div>
<div class="panel">
<h2>✍️ Meme Editor</h2>
<div class="field"><label>माथिको Text</label><input id="top" value="जब salary आउँछ..." maxlength="90"></div>
<div class="field"><label>तलको Text</label><input id="bottom" value="तर खर्च पहिल्यै तयार हुन्छ 😂" maxlength="90"></div>
<div class="field"><label>Font Size <span id="sizeVal">62</span>px</label><input id="size" class="range" type="range" min="28" max="110" value="62"></div>
<div class="row"><div class="field"><label>Text Color</label><input id="color" type="color" value="#ffffff"></div><div class="field"><label>Outline</label><input id="outline" type="color" value="#000000"></div></div>
<div class="checks"><label><input id="upper" type="checkbox"> CAPS</label><label><input id="shadow" type="checkbox" checked> Shadow</label></div>
<div class="field" style="margin-top:13px"><label>Quick Ideas</label><div class="ideas"><button class="idea">Kuwait life 😂</button><button class="idea">Salary day 💸</button><button class="idea">घरको call 📞</button><button class="idea">Nepali student 📚</button></div></div>
<div class="actions"><button class="btn secondary" id="random">🎲 Random Meme</button><button class="btn primary" id="download">⬇️ Download PNG</button></div><button class="btn secondary share" id="share" style="width:100%">📤 Share Meme</button>
</div></section>
<section class="templates"><h2>🔥 Meme Ideas</h2><div class="template-grid"><button class="template" data-t="जब salary आउँछ..." data-b="तर पैसा कहाँ गयो? 😭"><span>💸</span>Salary</button><button class="template" data-t="घरबाट call आउँदा" data-b="अहिले busy छु भनेर कसरी भनूँ? 😂"><span>📞</span>घरको Call</button><button class="template" data-t="विदेशमा नेपाली" data-b="काम पनि, घरको याद पनि ❤️"><span>🌍</span>विदेश Life</button><button class="template" data-t="Exam भोलि छ" data-b="आजदेखि पढ्छु... पक्का! 😎"><span>📚</span>Student</button></div></section>
<p class="hint">🔒 फोटो browser मै process हुन्छ — server मा upload हुँदैन।</p>
</main>
<script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/shared-shell.js"></script>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),file=document.getElementById('file'),topT=document.getElementById('top'),botT=document.getElementById('bottom'),size=document.getElementById('size'),sizeVal=document.getElementById('sizeVal'),color=document.getElementById('color'),outline=document.getElementById('outline'),upper=document.getElementById('upper'),shadow=document.getElementById('shadow');let img=null;
function fitText(text,max){let s=text;if(upper.checked)s=s.toUpperCase();return s}
function draw(){ctx.clearRect(0,0,c.width,c.height);if(img){let r=Math.max(c.width/img.width,c.height/img.height),w=img.width*r,h=img.height*r;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h)}else{let g=ctx.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#b91c1c');g.addColorStop(1,'#111827');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);ctx.font='900 150px sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.fillText('😂',540,530)}
ctx.textAlign='center';ctx.font='900 '+size.value+'px Arial, sans-serif';ctx.lineJoin='round';ctx.lineWidth=Math.max(5,size.value*.09);ctx.fillStyle=color.value;ctx.strokeStyle=outline.value; if(shadow.checked){ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=9;ctx.shadowOffsetY=4}else ctx.shadowColor='transparent';
const top=fitText(topT.value,maxText(topT.value)),bottom=fitText(botT.value,maxText(botT.value));text(top,540,90);text(bottom,540,990);ctx.shadowColor='transparent'}
function maxText(t){return t.length>34?t.slice(0,34)+'…':t}function text(t,x,y){if(!t)return;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{img=im;draw()};im.src=URL.createObjectURL(f)};[topT,botT,size,color,outline,upper,shadow].forEach(x=>x.addEventListener('input',()=>{sizeVal.textContent=size.value;draw()}));
document.querySelectorAll('.idea').forEach(b=>b.onclick=()=>{topT.value=b.textContent;botT.value='बस यस्तै हो जिन्दगी 😂';draw()});document.querySelectorAll('.template').forEach(b=>b.onclick=()=>{topT.value=b.dataset.t;botT.value=b.dataset.b;draw()});
document.getElementById('random').onclick=()=>{let a=[['जब salary आउँछ...','तर पैसा पहिल्यै सकिएको हुन्छ 😂'],['घरबाट call आउँदा','“खाना खायौ?” अनि ३० मिनेटको interview 😭'],['Nepali विदेशमा','काम १२ घण्टा, सपना २४ घण्टा ❤️'],['Exam भोलि छ','YouTube आजदेखि बन्द गर्छु... पक्का! 😂'],['म पैसा बचाउँछु','Online shopping: Challenge accepted 😎']];let x=a[Math.floor(Math.random()*a.length)];topT.value=x[0];botT.value=x[1];draw()};
document.getElementById('download').onclick=()=>{draw();let a=document.createElement('a');a.download='nepali-patro-meme.png';a.href=c.toDataURL('image/png');a.click()};document.getElementById('share').onclick=async()=>{draw();c.toBlob(async blob=>{let f=new File([blob],'nepali-patro-meme.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({title:'Nepali Patro Meme',text:'मैले नेपाली पात्रोबाट meme बनाएँ 😂',files:[f]})}catch(e){}}else document.getElementById('download').click()})};draw();
</script>
</body></html>
