<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="नेपालसँगै प्रमुख क्षेत्रहरूको वर्तमान समय हेर्नुहोस्।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>विश्व समय — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>विश्व समय</h1><p>नेपालसँगै प्रमुख क्षेत्रहरूको वर्तमान समय हेर्नुहोस्।</p></section><section class="grid" id="zones"></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>const z=[['नेपाल','Asia/Kathmandu'],['कुवेत','Asia/Kuwait'],['भारत','Asia/Kolkata'],['जापान','Asia/Tokyo'],['बेलायत','Europe/London'],['अमेरिका (NY)','America/New_York']];function draw(){set('zones',z.map(([n,t])=>'<div class="card"><span class="pill">'+n+'</span><div class="big">'+new Intl.DateTimeFormat('en-GB',{timeZone:t,hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())+'</div><div class="muted">'+new Intl.DateTimeFormat('ne-NP',{timeZone:t,dateStyle:'medium'}).format(new Date())+'</div></div>').join(''))}draw();setInterval(draw,1000)</script></body></html>
