<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="नेपाली पात्रो — BS/AD जन्म मिति सहित वैदिक जन्म कुण्डली"><title>जन्म कुण्डली — नेपाली पात्रो</title><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/main.css"><style>:root{--r:#b42318;--l:#e4e7ec;--m:#667085;--s:#f8f9fc}*{box-sizing:border-box}body{margin:0}.k{max-width:1180px;margin:auto;padding:24px 14px 60px}.hero h1{font-size:clamp(30px,6vw,48px);margin:4px 0}.hero p{color:var(--m)}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:18px;box-shadow:0 10px 30px #1018280d}.sticky{position:sticky;top:12px}.switch{display:grid;grid-template-columns:1fr 1fr;margin-bottom:14px;background:var(--s);padding:4px;border-radius:12px}.switch button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:900;cursor:pointer}.switch .on{background:var(--r);color:#fff}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.preset{border:1px solid var(--l);background:var(--s);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:11px;font-weight:800}.primary{width:100%;border:0;border-radius:11px;padding:13px;background:var(--r);color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.5}.status{margin-top:10px;padding:10px;border-radius:10px;background:var(--s);color:#475467;font-size:12px}.error{background:#fef3f2;color:#b42318}.ok{background:#ecfdf3;color:#067647}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric,.box{border:1px solid var(--l);border-radius:12px;padding:10px}.metric small{display:block;color:var(--m);font-size:10px}.metric b{display:block;margin-top:4px;font-size:13px}.section{margin-top:15px}.section h2{font-size:18px;margin:0 0 9px}.table-wrap{overflow:auto;border:1px solid var(--l);border-radius:12px}.table{width:100%;min-width:650px;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eaecf0;text-align:left;font-size:12px}.table th{background:var(--s);font-size:10px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.house{min-height:78px;border:1px solid var(--l);border-radius:10px;padding:8px}.house strong{color:var(--r);font-size:11px}.house p{font-size:11px;color:#475467;margin:5px 0;line-height:1.4}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.tool{border:1px solid var(--l);background:#fff;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.loading{text-align:center;padding:40px;color:var(--m)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static}.summary{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}@media(max-width:520px){.k{padding:15px 8px}.card{padding:14px}.two{grid-template-columns:1fr}.houses{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="np-header"><a class="np-brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/"><span class="np-logo">प</span><span><strong>नेपाली पात्रो</strong><small>Nepali Patro</small></span></a><nav><a href="https://apps.laxmannepal.com.np/Nepali-Patro/patro/">पात्रो</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/panchanga/">पञ्चाङ्ग</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/jyotish/">ज्योतिष</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/parba/">पर्व</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/converter/">रूपान्तरण</a></nav></header><main class="k"><section class="hero"><b style="color:var(--r)">वैदिक जन्म ज्योतिष</b><h1>🔮 जन्म कुण्डली</h1><p>BS वा AD जन्ममिति छान्नुहोस्। BS मिति अब बाहिरी converter बिना स्थानीय रूपमा रूपान्तरण हुन्छ।</p></section><div class="layout"><section class="card sticky"><h2>जन्म विवरण</h2><div class="switch"><button id="bsTab" class="on">वि.सं. (BS)</button><button id="adTab">AD</button></div><div id="bsFields"><div class="field"><label>BS वर्ष</label><input id="bsY" type="number" min="1975" max="2099" value="2078"></div><div class="two"><div class="field"><label>BS महिना</label><select id="bsM"><option value="1">बैशाख</option><option value="2">जेठ</option><option value="3">असार</option><option value="4">श्रावण</option><option value="5">भदौ</option><option value="6">असोज</option><option value="7">कार्तिक</option><option value="8">मंसिर</option><option value="9">पौष</option><option value="10">माघ</option><option value="11">फाल्गुण</option><option value="12">चैत्र</option></select></div><div class="field"><label>दिन</label><input id="bsD" type="number" min="1" max="32" value="4"></div></div><div id="converted" class="status">BS → AD जाँच हुँदैछ…</div></div><div id="adFields" style="display:none"><div class="field"><label>जन्म मिति (AD)</label><input id="date" type="date" value="2002-03-18"></div></div><div class="field"><label>नाम</label><input id="name" placeholder="जस्तै: Laxman"></div><div class="field"><label>जन्म समय</label><input id="time" type="time" value="12:00"></div><div class="field"><label>समय क्षेत्र (UTC offset)</label><input id="tz" type="number" step="0.25" value="5.75"></div><div class="field"><label>जन्म स्थान</label><input id="place" value="Kathmandu, Nepal"></div><div class="field"><label>Latitude / Longitude</label><div class="two"><input id="lat" type="number" step="0.000001" value="27.7172"><input id="lon" type="number" step="0.000001" value="85.3240"></div><div class="presets"><button class="preset" data-p="ktm">काठमाडौं</button><button class="preset" data-p="hetauda">हेटौंडा</button><button class="preset" data-p="kuwait">Kuwait</button></div></div><div class="field"><label>भाव प्रणाली</label><select id="hs"><option value="P">Placidus</option><option value="E">Equal House</option><option value="W">Whole Sign</option></select></div><button id="calc" class="primary" disabled>Ephemeris तयार हुँदैछ…</button><div id="status" class="status">Astronomical engine सुरु हुँदैछ।</div><div class="toolbar" style="margin-top:10px"><button id="print" class="tool">🖨️ Print / PDF</button><button id="share" class="tool">🔗 Share</button></div></section><section class="card"><div id="result"><div class="loading">Engine तयार भएपछि कुण्डली निकाल्नुहोस्।</div></div></section></div></main><script type="module">import {load} from 'https://esm.sh/@fusionstrings/swisseph-wasi@0.1.0?bundle';const $=x=>document.getElementById(x),norm=x=>(x%360+360)%360,signs=['मेष','वृष','मिथुन','कर्कट','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुम्भ','मीन'],nak=['अश्विनी','भरणी','कृत्तिका','रोहिणी','मृगशिरा','आर्द्रा','पुनर्वसु','पुष्य','आश्लेषा','मघा','पूर्वाफाल्गुनी','उत्तराफाल्गुनी','हस्त','चित्रा','स्वाती','विशाखा','अनुराधा','ज्येष्ठा','मूल','पूर्वाषाढा','उत्तराषाढा','श्रवण','धनिष्ठा','शतभिषा','पूर्वाभाद्रपदा','उत्तराभाद्रपदा','रेवती'],pnames=['सूर्य','चन्द्र','बुध','शुक्र','मंगल','बृहस्पति','शनि'],psym=['☉','☽','☿','♀','♂','♃','♄'];const P={A:[31,31,32,32,31,30,30,29,30,29,30,30,365],B:[31,32,31,32,31,30,30,30,29,29,30,31,366],C:[30,32,31,32,31,31,29,30,30,29,29,31,365],D:[31,31,32,31,31,31,30,29,30,29,30,30,365],E:[31,31,31,32,31,31,29,30,30,29,29,31,365],F:[31,31,31,32,31,31,29,30,30,29,30,30,365],G:[31,32,31,32,31,30,30,29,30,29,30,30,365],H:[31,31,31,32,31,31,30,29,30,29,30,30,365],I:[31,32,31,32,31,30,30,30,29,29,30,30,365],J:[31,32,31,32,31,30,30,30,29,30,29,31,366],K:[31,31,32,31,32,30,30,29,30,29,30,30,365],L:[30,32,31,32,31,30,30,30,29,30,29,31,365],M:[30,32,31,32,31,31,29,30,29,30,29,31,365]};const Y={1975:'A',1976:'B',1977:'C',1978:'D',1979:'A',1980:'B',1981:'E',1982:'D',1983:'A',1984:'B',1985:'F',1986:'D',1987:'G',1988:'B',1989:'H',1990:'D',1991:'I',1992:'J',1993:'H',1994:'D',1995:'I',1996:'J',1997:'D',1998:'K',1999:'B',2000:'L',2001:'D',2002:'A',2003:'B',2004:'L',2005:'D',2006:'A',2007:'B',2008:'E',2009:'D',2010:'A',2011:'B',2012:'F',2013:'D',2014:'A',2015:'B',2016:'F',2017:'D',2018:'G',2019:'J',2020:'H',2021:'D',2022:'I',2023:'J',2024:'H',2025:'D',2026:'B',2027:'L',2028:'D',2029:'K',2030:'B',2031:'L',2032:'D',2033:'A',2034:'B',2035:'C',2036:'D',2037:'A',2038:'B',2039:'F',2040:'D',2041:'A',2042:'B',2043:'F',2044:'D',2045:'G',2046:'B',2047:'H',2048:'D',2049:'I',2050:'J',2051:'H',2052:'D',2053:'I',2054:'J',2055:'D',2056:'K',2057:'B',2058:'L',2059:'D',2060:'A',2061:'B',2062:'M',2063:'D',2064:'A',2065:'B',2066:'E',2067:'D',2068:'A',2069:'B',2070:'F',2071:'D',2072:'G',2073:'B',2074:'H',2075:'D',2076:'I',2077:'J',2078:'H',2079:'D',2080:'I',2081:'J',2082:'D',2083:'D',2084:'B',2085:'L',2086:'D',2087:'A',2088:'B',2089:'L',2090:'D',2091:'A',2092:'B',2093:'E',2094:'D',2095:'A',2096:'B',2097:'F',2098:'D',2099:'A'};const BASE=new Date(Date.UTC(1943,3,14));function md(y){return P[Y[y]]}function bsToAd(y,m,d){y=+y;m=+m;d=+d;if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)||!Y[y]||m<1||m>12)throw Error('यो BS मिति supported conversion range मा छैन।');const a=md(y);if(d<1||d>a[m-1])throw Error(`${y}-${m}-${d} BS मा दिन ${a[m-1]} सम्म मात्र हुन्छ।`);let days=0;if(y>=2000){for(let yy=2000;yy<y;yy++)days+=md(yy)[12]}else{for(let yy=y;yy<2000;yy++)days-=md(yy)[12]}for(let i=0;i<m-1;i++)days+=a[i];days+=d-1;const z=new Date(BASE.getTime()+days*86400000);return{year:z.getUTCFullYear(),month:z.getUTCMonth()+1,date:z.getUTCDate()}}function adToBs(ys,ms,ds){const z=new Date(Date.UTC(+ys,+ms-1,+ds));let days=Math.round((z-BASE)/86400000),y=2000;if(days>=0){while(days>=md(y)[12]&&y<2099){days-=md(y)[12];y++}}else{while(days<0&&y>1975){y--;days+=md(y)[12]}}if(days<0||!Y[y])throw Error('AD मिति supported BS range बाहिर छ।');const a=md(y);let m=1;while(days>=a[m-1]&&m<12){days-=a[m-1];m++}return{year:y,month:m,date:days+1}}function testBS(){const t=[['2078-12-4',[2022,3,18]],['2078-1-1',[2021,4,14]],['2080-1-1',[2023,4,14]],['2079-10-17',[2023,1,31]],['2000-1-1',[1943,4,14]]];for(const [s,v]of t){const [y,m,d]=s.split('-').map(Number),r=bsToAd(y,m,d);if(r.year!==v[0]||r.month!==v[1]||r.date!==v[2])throw Error('BS self-test failed: '+s+' → '+JSON.stringify(r))}return true}let eph=null,useBS=true;const locations={ktm:['काठमाडौं, Nepal',27.7172,85.3240,5.75],hetauda:['हेटौंडा, Nepal',27.4287,85.0322,5.75],kuwait:['Kuwait City, Kuwait',29.3759,47.9774,3]};function st(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c}function showConverted(){try{const y=+$('bsY').value,m=+$('bsM').value,d=+$('bsD').value,x=bsToAd(y,m,d);$('converted').textContent=`✓ ${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')} BS = ${x.year}-${String(x.month).padStart(2,'0')}-${String(x.date).padStart(2,'0')} AD`;$('converted').className='status ok';return x}catch(e){$('converted').textContent='BS मिति गलत: '+e.message;$('converted').className='status error';return null}}function dateValue(){if(!useBS)return $('date').value;const x=showConverted();return x?`${x.year}-${String(x.month).padStart(2,'0')}-${String(x.date).padStart(2,'0')}`:null}function fmt(x){x=norm(x);const s=Math.floor(x/30),d=x-s*30,mi=Math.floor((d-Math.floor(d))*60);return `${signs[s]} ${Math.floor(d)}° ${String(mi).padStart(2,'0')}′`}function ninfo(x){const a=360/27,n=Math.floor(norm(x)/a),p=Math.floor((norm(x)-n*a)/(a/4))+1;return `${nak[n]} — पाद ${p}`}function sgn(x){return Math.floor(norm(x)/30)}function d9(x){const s=sgn(x),part=Math.floor((norm(x)%30)/(30/9)),start=[0,3,6,9].includes(s)?s:[1,4,7,10].includes(s)?(s+8)%12:(s+4)%12;return(start+part)%12}function chart(title,arr,isD9=false){const c=Array.from({length:12},()=>[]);for(const p of arr)c[isD9?d9(p.lon):sgn(p.lon)].push(p.sym+p.name.slice(0,2));let out=`<div class="box"><h3>${title}</h3><div class="houses">`;for(let i=0;i<12;i++)out+=`<div class="house"><strong>${i+1} · ${signs[i]}</strong><p>${c[i].join(' · ')||'—'}</p></div>`;return out+'</div></div>'}function render(data){let rows=data.planets.map(p=>`<tr><td>${p.sym} ${p.name}</td><td><b>${fmt(p.lon)}</b></td><td>${p.speed<0?'वक्री':'मार्गी'}</td></tr>`).join('');rows+=`<tr><td>☊ राहु</td><td><b>${fmt(data.rahu)}</b></td><td>Node</td></tr><tr><td>☋ केतु</td><td><b>${fmt(data.ketu)}</b></td><td>Node</td></tr>`;$('result').innerHTML=`<h2>${$('name').value||'जन्म कुण्डली'}</h2><div class="summary"><div class="metric"><small>लग्न</small><b>${fmt(data.asc)}</b></div><div class="metric"><small>चन्द्र राशि</small><b>${signs[sgn(data.planets[1].lon)]}</b></div><div class="metric"><small>नक्षत्र</small><b>${ninfo(data.planets[1].lon)}</b></div><div class="metric"><small>AD</small><b>${data.date}</b></div><div class="metric"><small>स्थान</small><b>${$('place').value}</b></div></div><div class="section"><h2>ग्रह स्थिति</h2><div class="table-wrap"><table class="table"><thead><tr><th>ग्रह</th><th>निरायण स्थिति</th><th>गति</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="section charts">${chart('D1 / राशि',data.planets)}${chart('D9 / नवांश',data.planets,true)}</div><div class="section"><h2>भाव</h2><div class="houses">${Array.from({length:12},(_,i)=>`<div class="house"><strong>${i+1} भाव</strong><p>राशि: ${signs[(data.ascSign+i)%12]}</p><p>ग्रह: ${data.planets.filter(p=>((sgn(p.lon)-data.ascSign+12)%12)===i).map(p=>p.name).join(', ')||'—'}</p></div>`).join('')}</div></div><div class="section box"><h2>जन्म विवरण</h2><p>AD: ${data.date} · समय: ${$('time').value} · UTC ${+$('tz').value>=0?'+':''}${$('tz').value}</p><p>स्थान: ${$('place').value} · ${$('lat').value}, ${$('lon').value}</p><p>पद्धति: Sidereal / Lahiri · House: ${$('hs').value}</p></div>`}async function calculate(){try{const date=dateValue();if(!date)throw Error('वैध जन्म मिति छान्नुहोस्।');const [y,m,d]=date.split('-').map(Number),[hh,mm]=$('time').value.split(':').map(Number),tz=+$('tz').value,lat=+$('lat').value,lon=+$('lon').value;if(!Number.isFinite(lat)||lat<-90||lat>90||!Number.isFinite(lon)||lon<-180||lon>180)throw Error('Latitude/Longitude गलत छ।');const ut=hh+mm/60-tz,jd=eph.swe_julday(y,m,d,ut,1);const planets=[0,1,2,3,4,5,6].map((id,i)=>{const r=eph.swe_calc_ut(jd,id,0),a=r[0]??r.xx?.[0]??r.longitude,s=r[3]??r.xx?.[3]??0;return{name:pnames[i],sym:psym[i],lon:norm(a),speed:s}});const rr=eph.swe_calc_ut(jd,10,0),rahu=norm(rr[0]??rr.xx?.[0]??rr.longitude),ketu=norm(rahu+180);let asc=0;if(typeof eph.swe_houses_ex==='function'){const h=eph.swe_houses_ex(jd,1,lat,lon,$('hs').value.charCodeAt(0));asc=norm(h.ascmc?.[0]??h[0]??0)}else throw Error('House engine उपलब्ध छैन।');render({date,planets,rahu,ketu,asc,ascSign:sgn(asc)});st('✓ कुण्डली गणना सम्पन्न भयो।','ok')}catch(e){st('कुण्डली गणना असफल: '+(e?.message||e),'error')}}$('bsTab').onclick=()=>{useBS=true;$('bsTab').className='on';$('adTab').className='';$('bsFields').style.display='';$('adFields').style.display='none';showConverted()};$('adTab').onclick=()=>{useBS=false;$('adTab').className='on';$('bsTab').className='';$('bsFields').style.display='none';$('adFields').style.display='';};['bsY','bsM','bsD'].forEach(id=>$(id).addEventListener('input',showConverted));document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{const x=locations[b.dataset.p];$('place').value=x[0];$('lat').value=x[1];$('lon').value=x[2];$('tz').value=x[3]});$('calc').onclick=calculate;$('print').onclick=()=>window.print();$('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('date',dateValue()||'');u.searchParams.set('time',$('time').value);u.searchParams.set('lat',$('lat').value);u.searchParams.set('lon',$('lon').value);try{await navigator.clipboard.writeText(u.href);st('✓ Share link copied.','ok')}catch{prompt('Share link',u.href)}};try{testBS();$('converted').textContent='✓ BS self-test passed: 2078-12-04 = 2022-03-18';$('converted').className='status ok';eph=await load();$('calc').disabled=false;$('calc').textContent='कुण्डली निकाल्नुहोस्';st('✓ BS converter self-test + astronomical engine तयार छ।','ok')}catch(e){$('calc').disabled=true;st('इन्जिन लोड भएन: '+(e?.message||e),'error')}})();</script></body></html>
