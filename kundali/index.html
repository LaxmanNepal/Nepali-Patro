<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b42318"><meta name="description" content="नेपाली पात्रोको वैदिक जन्म कुण्डली — Lahiri sidereal Swiss Ephemeris calculations.">
<title>जन्म कुण्डली — नेपाली पात्रो</title>
<link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/main.css">
<style>
:root{--red:#b42318;--ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#f8f9fc;--gold:#b54708}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff}.k{max-width:1180px;margin:auto;padding:24px 14px 60px}.hero{margin-bottom:18px}.hero b{color:var(--red);font-size:13px}.hero h1{font-size:clamp(30px,6vw,48px);margin:4px 0}.hero p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px #1018280d;padding:18px}.sticky{position:sticky;top:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.place-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.preset{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:11px;font-weight:800}.primary{width:100%;padding:13px;border:0;border-radius:11px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.status{margin-top:10px;padding:10px;border-radius:10px;background:var(--soft);color:#475467;font-size:12px}.status.error{background:#fef3f2;color:#b42318}.status.ok{background:#ecfdf3;color:#067647}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850;cursor:pointer;font-size:12px}.tab.active{background:var(--red);border-color:var(--red);color:#fff}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}.metric{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{display:block;margin-top:4px;font-size:14px}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;min-width:680px;border-collapse:collapse}.table th,.table td{padding:9px 10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:12px}.table th{background:var(--soft);font-size:10px}.table tr:last-child td{border-bottom:0}.chart{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vedic-chart{width:100%;aspect-ratio:1;border:2px solid var(--red);background:#fff;display:block}.chart-note{font-size:11px;color:var(--muted);margin-top:7px}.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.house{min-height:82px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.house strong{font-size:11px;color:var(--red)}.house p{margin:5px 0 0;font-size:11px;color:#475467;line-height:1.4}.dasha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dasha .box,.info{border:1px solid var(--line);border-radius:11px;padding:10px}.dasha small{display:block;color:var(--muted)}.dasha b{font-size:13px}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#fef0c7;color:#93370d;font-size:10px;font-weight:900}.warning{padding:10px;border-radius:11px;background:#fffaeb;color:#93370d;font-size:11px;line-height:1.5}.loading{padding:35px;text-align:center;color:var(--muted)}.savebar{display:flex;gap:8px;margin-top:12px}.secondary{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850;cursor:pointer}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static}.summary{grid-template-columns:repeat(2,1fr)}.chart{grid-template-columns:1fr}}@media(max-width:520px){.k{padding:15px 8px}.card{padding:14px}.two{grid-template-columns:1fr}.grid12{grid-template-columns:repeat(2,1fr)}.dasha{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="np-header"><a class="np-brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/"><span class="np-logo">प</span><span><strong>नेपाली पात्रो</strong><small>Nepali Patro</small></span></a><nav><a href="https://apps.laxmannepal.com.np/Nepali-Patro/patro/">पात्रो</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/panchanga/">पञ्चाङ्ग</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/jyotish/">ज्योतिष</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/parba/">पर्व</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/converter/">रूपान्तरण</a></nav></header>
<main class="k">
<section class="hero"><b>वैदिक जन्म ज्योतिष</b><h1>🔮 जन्म कुण्डली</h1><p>Swiss Ephemeris आधारित Lahiri sidereal गणना • D1 • D9 • भाव • नक्षत्र • Vimshottari Dasha</p></section>
<div class="layout">
<section class="card sticky"><h2>जन्म विवरण</h2>
<div class="field"><label>नाम</label><input id="name" placeholder="जस्तै: Laxman"></div>
<div class="field"><label>जन्म मिति (AD)</label><input id="date" type="date" value="2002-03-18"></div>
<div class="field"><label>जन्म समय</label><input id="time" type="time" value="12:00"></div>
<div class="field"><label>समय क्षेत्र (UTC offset)</label><input id="tz" type="number" step="0.25" value="5.75"></div>
<div class="field"><label>जन्म स्थान</label><input id="place" value="Kathmandu, Nepal"></div>
<div class="field"><label>Latitude / Longitude</label><div class="two"><input id="lat" type="number" step="0.000001" value="27.7172"><input id="lon" type="number" step="0.000001" value="85.3240"></div><div class="place-presets"><button class="preset" data-p="ktm">काठमाडौं</button><button class="preset" data-p="hetauda">हेटौंडा</button><button class="preset" data-p="kuwait">Kuwait</button></div></div>
<div class="field"><label>भाव प्रणाली</label><select id="houseSystem"><option value="P">Placidus</option><option value="E">Equal House</option><option value="W">Whole Sign</option></select></div>
<button class="primary" id="calc" disabled>Ephemeris तयार हुँदैछ…</button><div id="status" class="status">Swiss Ephemeris browser engine सुरु हुँदैछ।</div>
<div class="savebar"><button class="secondary" id="print">🖨️ Print / PDF</button><button class="secondary" id="share">🔗 Share</button></div>
</section>
<section class="card"><div id="result"><div class="loading">पहिले ephemeris engine तयार हुन दिनुहोस्…</div></div></section>
</div></main>
<script type="module">
import { load } from 'https://esm.sh/@fusionstrings/swisseph-wasi@0.1.0?bundle';
const $=id=>document.getElementById(id), norm=x=>(x%360+360)%360, deg=x=>Math.floor(x), min=x=>Math.floor((x-Math.floor(x))*60), signs=['मेष','वृष','मिथुन','कर्कट','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुम्भ','मीन'],nak=['अश्विनी','भरणी','कृत्तिका','रोहिणी','मृगशिरा','आर्द्रा','पुनर्वसु','पुष्य','आश्लेषा','मघा','पूर्वाफाल्गुनी','उत्तराफाल्गुनी','हस्त','चित्रा','स्वाती','विशाखा','अनुराधा','ज्येष्ठा','मूल','पूर्वाषाढा','उत्तराषाढा','श्रवण','धनिष्ठा','शतभिषा','पूर्वाभाद्रपदा','उत्तराभाद्रपदा','रेवती'],lords=['केतु','शुक्र','सूर्य','चन्द्र','मंगल','राहु','बृहस्पति','शनि','बुध'],dashaYears={केतु:7,शुक्र:20,सूर्य:6,चन्द्र:10,मंगल:7,राहु:18,बृहस्पति:16,शनि:19,बुध:17};
const planetDefs=[['सूर्य',0,'☉'],['चन्द्र',1,'☽'],['बुध',2,'☿'],['शुक्र',3,'♀'],['मंगल',4,'♂'],['बृहस्पति',5,'♃'],['शनि',6,'♄'],['राहु',10,'☊'],['केतु',11,'☋']];
let eph=null,last=null;
function setStatus(t,c=''){const s=$('status');s.textContent=t;s.className='status '+c}
function signPos(x){x=norm(x);const s=Math.floor(x/30),d=x-s*30;return {sign:s,deg:d,txt:`${signs[s]} ${deg(d)}° ${String(min(d)).padStart(2,'0')}′`}}
function nakPos(x){x=norm(x);const span=360/27,n=Math.floor(x/span),p=Math.floor((x-n*span)/(span/4))+1;return {n,p,txt:`${nak[n]} — पाद ${p}`}}
function houseFor(lagnaSign,lon){return ((Math.floor(norm(lon)/30)-lagnaSign+12)%12)+1}
function d9Sign(lon){const s=Math.floor(norm(lon)/30),d=norm(lon)%30,part=Math.floor(d/3.3333333333333335), movable=[0,3,6,9].includes(s),fixed=[1,4,7,10].includes(s);let start=movable?s:fixed?((s+8)%12):((s+4)%12);return (start+part)%12}
function jd(y,m,d,h){return eph.swe_julday(y,m,d,h,1)}
function parse(){const [y,mo,da]=$('date').value.split('-').map(Number),[hh,mm]=$('time').value.split(':').map(Number),tz=+$('tz').value,lat=+$('lat').value,lon=+$('lon').value;if(!y||!mo||!da||!Number.isFinite(tz)||!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)throw Error('जन्म मिति, समय, timezone र coordinates जाँच गर्नुहोस्।');return {y,mo,da,hh,mm,tz,lat,lon,place:$('place').value||'—',name:$('name').value||'जन्म कुण्डली'}}
function fmtDate(y,m,d,h){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')} ${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round((h%1)*60)).padStart(2,'0')}`}
function dashaTimeline(jdBirth,moonLon){const n=nakPos(moonLon),lord=lords[n.n%9],span=360/27,elapsed=(moonLon-(n.n*span))/span,balance=dashaYears[lord]*(1-elapsed);let startMs=Date.UTC(parse().y,parse().mo-1,parse().da,parse().hh,parse().mm)-parse().tz*3600000,cur=startMs,items=[];let idx=lords.indexOf(lord);for(let i=0;i<9;i++){const l=lords[(idx+i)%9],years=i===0?balance:dashaYears[l],end=cur+years*365.2425*86400000;items.push({l,start:new Date(cur),end:new Date(end)});cur=end}return items}
function chartSvg(planets,lagna,kind='D1'){const cells=Array.from({length:12},()=>[]);for(const p of planets){const s=kind==='D1'?Math.floor(norm(p.lon)/30):d9Sign(p.lon);cells[s].push(p.sym+p.name.slice(0,2))}const ls=kind==='D1'?lagna:d9Sign(lagna);cells[ls].unshift('लग्न');let svg='<svg class="vedic-chart" viewBox="0 0 600 600" aria-label="'+kind+' chart">';svg+='<rect x="4" y="4" width="592" height="592" fill="white" stroke="#b42318" stroke-width="5"/><path d="M4 4L596 596M596 4L4 596M300 4V596M4 300H596" stroke="#b42318" stroke-width="2" fill="none"/><rect x="150" y="150" width="300" height="300" fill="white" stroke="#b42318" stroke-width="2"/><path d="M150 150L450 450M450 150L150 450" stroke="#b42318" stroke-width="2"/>';const xy=[[55,55],[300,55],[545,55],[545,300],[545,545],[300,545],[55,545],[55,300],[170,170],[430,170],[430,430],[170,430]];cells.forEach((a,i)=>{svg+=`<text x="${xy[i][0]}" y="${xy[i][1]}" text-anchor="middle" font-size="18" font-weight="800" fill="#b42318">${i+1}</text><text x="${xy[i][0]}" y="${xy[i][1]+25}" text-anchor="middle" font-size="15" fill="#101828">${a.slice(0,4).join(' ')}</text>`});svg+='</svg>';return svg}
function render(data){const {p,asc,houses,moon,nakshatra,ayan,meta}=data;const lagna=Math.floor(norm(asc)/30),dashas=dashaTimeline(meta.jd,moon);const rows=p.map(x=>{const sp=signPos(x.lon),h=houseFor(lagna,x.lon),np=nakPos(x.lon),d9=d9Sign(x.lon);return `<tr><td>${x.sym} ${x.name}</td><td><b>${sp.txt}</b></td><td>${h}</td><td>${np.txt}</td><td>${signs[d9]}</td><td>${x.speed<0?'वक्री':'मार्गी'}</td></tr>`}).join('');let houseRows=houses.map((h,i)=>`<div class="house"><strong>${i+1} भाव</strong><p>${signs[Math.floor(norm(h)/30)]}<br>${h.toFixed(2)}°</p></div>`).join('');let dashaRows=dashas.map(x=>`<div class="box"><small>${x.l}</small><b>${x.start.toLocaleDateString('en-GB')} → ${x.end.toLocaleDateString('en-GB')}</b></div>`).join('');const aspects=[];for(const a of p)for(const b of p)if(a.name<b.name){let diff=Math.abs(norm(a.lon-b.lon));diff=Math.min(diff,360-diff);if([0,60,90,120,180].some(v=>Math.abs(diff-v)<5))aspects.push(`${a.name} ↔ ${b.name} (${diff.toFixed(1)}°)`)}$('result').innerHTML=`<div class="toolbar"><button class="tab active">D1 जन्म कुण्डली</button><button class="tab">D9 नवांश</button><button class="tab">ग्रह</button><button class="tab">भाव</button><button class="tab">दशा</button></div><div class="summary"><div class="metric"><small>लग्न</small><b>${signPos(asc).txt}</b></div><div class="metric"><small>चन्द्र राशि</small><b>${signs[Math.floor(moon/30)]}</b></div><div class="metric"><small>नक्षत्र</small><b>${nakshatra.txt}</b></div><div class="metric"><small>अयनांश</small><b>${ayan.toFixed(4)}°</b></div><div class="metric"><small>स्थान</small><b>${meta.place}</b></div></div><div class="chart"><div><h2>D1 — राशि कुण्डली</h2>${chartSvg(p,asc,'D1')}<div class="chart-note">Whole-sign D1 display; ग्रहको exact degree तलको तालिकामा छ।</div></div><div><h2>D9 — नवांश</h2>${chartSvg(p,asc,'D9')}<div class="chart-note">Navamsa is calculated from each sidereal longitude.</div></div></div><div class="section"><h2>ग्रह स्थिति</h2><div class="table-wrap"><table class="table"><thead><tr><th>ग्रह</th><th>राशि / डिग्री</th><th>भाव</th><th>नक्षत्र</th><th>D9</th><th>गति</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="section"><h2>१२ भाव</h2><div class="grid12">${houseRows}</div></div><div class="section"><h2>विम्शोत्तरी महादशा</h2><div class="dasha">${dashaRows}</div></div><div class="section"><h2>मुख्य संकेत</h2><div class="info"><p><span class="pill">Moon Nakshatra</span> ${nakshatra.txt}</p><p><span class="pill">Ascendant</span> ${signPos(asc).txt}</p><p><span class="pill">Aspects</span> ${aspects.length?aspects.slice(0,8).join(' • '):'प्रमुख कोण भेटिएन'}</p></div></div><div class="section warning"><b>गणना नीति:</b> ग्रह/भावका astronomical values Swiss Ephemeris बाट लिइन्छन्; Lahiri sidereal mode प्रयोग गरिएको छ। ज्योतिषीय interpretation परम्परा अनुसार फरक हुन सक्छ। जन्म समय वा स्थान गलत भए Lagna/भाव/Dasha पनि बदलिन सक्छ।</div>`}
async function calculate(){try{if(!eph)throw Error('Ephemeris तयार भएको छैन।');const m=parse(),ut=m.hh+m.mm/60-m.tz,J=jd(m.y,m.mo,m.da,ut);eph.swe_set_sid_mode(1,0,0);const FLAG=4|256|65536;const p=planetDefs.map(([name,id,sym])=>{const r=eph.swe_calc_ut(J,id,FLAG);const xx=r.xx||r;return {name,sym,lon:norm(xx[0]),speed:xx[3]??0}});const hr=eph.swe_houses_ex(J,65536,m.lat,m.lon,$('houseSystem').value.charCodeAt(0));const cusps=Array.from(hr.cusps||[]).filter((_,i)=>i>0);const asc=norm((hr.ascmc||[])[0]);const moon=p[1].lon,nakshatra=nakPos(moon),ayan=eph.swe_get_ayanamsa_ut(J);last={p,asc,houses:cusps,moon,nakshatra,ayan,meta:{jd:J,place:m.place}};render(last);setStatus('✓ पूर्ण कुण्डली गणना सम्पन्न भयो।','ok')}catch(e){console.error(e);setStatus('कुण्डली गणना असफल: '+(e?.message||e),'error')}}
$('calc').onclick=calculate;$('print').onclick=()=>window.print();$('share').onclick=async()=>{const u=location.href+'#'+btoa(unescape(encodeURIComponent(JSON.stringify({date:$('date').value,time:$('time').value,lat:$('lat').value,lon:$('lon').value,tz:$('tz').value,place:$('place').value}))));try{await navigator.clipboard.writeText(u);setStatus('✓ Share link clipboard मा copy भयो।','ok')}catch{setStatus('Share link: '+u)}};
const presets={ktm:['Kathmandu, Nepal','27.7172','85.3240','5.75'],hetauda:['Hetauda, Nepal','27.4287','85.0322','5.75'],kuwait:['Kuwait City, Kuwait','29.3759','47.9774','3']};document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{const x=presets[b.dataset.p];$('place').value=x[0];$('lat').value=x[1];$('lon').value=x[2];$('tz').value=x[3]});
try{setStatus('Swiss Ephemeris engine सुरु हुँदैछ…');eph=await load();$('calc').disabled=false;$('calc').textContent='कुण्डली निकाल्नुहोस्';setStatus('✓ Swiss Ephemeris तयार छ।','ok');}catch(e){console.error(e);setStatus('❌ Swiss Ephemeris load भएन: '+(e?.message||e),'error');$('calc').disabled=true}
})();
</script>
</body></html>
