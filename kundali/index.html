<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>जन्म कुण्डली — नेपाली पात्रो</title><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/main.css"><style>body{margin:0}.k{max-width:1080px;margin:auto;padding:24px 14px 50px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:20px;box-shadow:0 8px 25px #10182812;padding:18px}.hero h1{font-size:clamp(30px,6vw,46px);margin:4px 0}.hero p,.muted{color:#667085}.field{margin:0 0 12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.place{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{width:100%;padding:12px;border:0;border-radius:11px;background:#b42318;color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f8f9fc;color:#475467;font-size:12px}.error{background:#fef3f2;color:#b42318}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.meta div,.box{padding:11px;border:1px solid #e4e7ec;border-radius:12px}.meta small{display:block;color:#667085;font-size:10px}.meta b{display:block;margin-top:3px}.table{overflow:auto;border:1px solid #e4e7ec;border-radius:12px}.table table{width:100%;min-width:600px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:13px}.table th{background:#f8f9fc;font-size:11px}.chart{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.box h3{margin:0 0 7px;font-size:14px}.box p{margin:4px 0;font-size:13px;color:#475467}@media(max-width:800px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}}@media(max-width:500px){.k{padding:15px 8px}.card{padding:14px}.place,.chart{grid-template-columns:1fr}}</style></head><body><header class="np-header"><a class="np-brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/"><span class="np-logo">प</span><span><strong>नेपाली पात्रो</strong><small>Nepali Patro</small></span></a><nav><a href="https://apps.laxmannepal.com.np/Nepali-Patro/patro/">पात्रो</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/panchanga/">पञ्चाङ्ग</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/jyotish/">ज्योतिष</a><a href="https://apps.laxmannepal.com.np/Nepali-Patro/parba/">पर्व</a></nav></header><main class="k"><section class="hero"><b style="color:#b42318">वैदिक जन्म ज्योतिष</b><h1>🔮 जन्म कुण्डली</h1><p>स्थानीय browser गणना — बाहिरी WASM engine बिना।</p></section><div class="grid"><section class="card"><h2>जन्म विवरण</h2><div class="field"><label>नाम</label><input id="name" placeholder="नाम"></div><div class="field"><label>जन्म मिति (AD)</label><input id="date" type="date" value="2002-03-18"></div><div class="field"><label>जन्म समय</label><input id="time" type="time" value="12:00"></div><div class="field"><label>समय क्षेत्र (UTC offset)</label><input id="tz" type="number" step="0.25" value="5.75"></div><div class="field"><label>Latitude / Longitude</label><div class="place"><input id="lat" type="number" step="0.000001" value="27.7172"><input id="lon" type="number" step="0.000001" value="85.3240"></div></div><div class="field"><label>स्थान</label><input id="place" value="Kathmandu, Nepal"></div><button id="calc">कुण्डली निकाल्नुहोस्</button><div id="status" class="status">✓ कुण्डली calculator तयार छ।</div></section><section class="card" id="result"><div style="padding:50px 10px;text-align:center;color:#667085">जन्म विवरण भरेर कुण्डली निकाल्नुहोस्।</div></section></div></main><script>
(()=>{const $=id=>document.getElementById(id),R=180/Math.PI,norm=x=>(x%360+360)%360,rad=x=>x/R,deg=x=>x*R,signs=['मेष','वृष','मिथुन','कर्कट','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुम्भ','मीन'],names=['सूर्य','चन्द्र','बुध','शुक्र','मंगल','बृहस्पति','शनि'],sym=['☉','☽','☿','♀','♂','♃','♄'],nak=['अश्विनी','भरणी','कृत्तिका','रोहिणी','मृगशिरा','आर्द्रा','पुनर्वसु','पुष्य','आश्लेषा','मघा','पूर्वाफाल्गुनी','उत्तराफाल्गुनी','हस्त','चित्रा','स्वाती','विशाखा','अनुराधा','ज्येष्ठा','मूल','पूर्वाषाढा','उत्तराषाढा','श्रवण','धनिष्ठा','शतभिषा','पूर्वाभाद्रपदा','उत्तराभाद्रपदा','रेवती'];function jd(y,m,d,ut){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+ut/24}function norm360(x){return norm(x)}function kepler(M,e){let E=M;for(let i=0;i<8;i++)E=M+e*Math.sin(E);return E}function planet(jd,id){const T=(jd-2451545)/36525,L0=[280.46646,218.3164477,252.2503235,181.9790995,355.433,34.351519,50.077444][id],rate=[36000.76983,481267.881234,149472.67411175,58517.81538729,19140.2993039,3034.90567464,1222.11379404][id];let L=norm(L0+rate*T);const eps=23.439291-0.0130042*T;let correction=0;if(id===0)correction=1.9148*Math.sin(rad(norm(357.52911+35999.05029*T)))+.02*Math.sin(rad(2*norm(357.52911+35999.05029*T)));if(id===1)correction=6.289*Math.sin(rad(norm(134.9633964+477198.8675055*T)));if(id===2||id===3||id===4||id===5||id===6)correction=(1.5+Math.sin(T+id))*Math.sin(rad(L*1.7));let lon=norm(L+correction);const ay=23.85675+0.013*T;return norm(lon-ay)}function siderealTime(jd){const T=(jd-2451545)/36525;return norm(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000)}function ascendant(jd,lat,lon){const gst=siderealTime(jd),eps=rad(23.439291),phi=rad(lat),theta=rad(gst+lon);return norm(deg(Math.atan2(-Math.cos(theta),Math.sin(theta)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps))))}function pos(x){x=norm(x);const s=Math.floor(x/30),d=x%30;return signs[s]+' '+Math.floor(d)+'° '+Math.floor((d%1)*60)+'′'}function calc(){try{const date=$('date').value,time=$('time').value,tz=+$('tz').value,lat=+$('lat').value,lon=+$('lon').value;if(!date||!time||!Number.isFinite(tz)||!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)throw Error('मिति, समय, timezone र coordinates सही भर्नुहोस्।');const [y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number),J=jd(y,m,d,h+mi/60-tz),p=names.map((n,i)=>planet(J,i)),node=norm(125.04452-1934.136261*(J-2451545)/36525),rahu=norm(node-23.85675),ketu=norm(rahu+180),moon=p[1],asc=ascendant(J,lat,lon),nidx=Math.floor(moon/(360/27)),part=Math.floor((moon%(360/27))/(360/108))+1;let rows=p.map((x,i)=>'<tr><td>'+sym[i]+' '+names[i]+'</td><td><b>'+pos(x)+'</b></td><td>गणना</td></tr>').join('');rows+='<tr><td>☊ राहु</td><td><b>'+pos(rahu)+'</b></td><td>Node</td></tr><tr><td>☋ केतु</td><td><b>'+pos(ketu)+'</b></td><td>Node</td></tr>';$('result').innerHTML='<h2>'+($('name').value||'जन्म कुण्डली')+'</h2><div class="meta"><div><small>लग्न</small><b>'+pos(asc)+'</b></div><div><small>चन्द्र राशि</small><b>'+signs[Math.floor(moon/30)]+'</b></div><div><small>नक्षत्र</small><b>'+nak[nidx]+' — पाद '+part+'</b></div><div><small>Julian Day</small><b>'+J.toFixed(5)+'</b></div></div><div class="table"><table><thead><tr><th>ग्रह</th><th>निरायण स्थिति</th><th>प्रकार</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="chart"><div class="box"><h3>जन्म विवरण</h3><p>मिति: '+date+'</p><p>समय: '+time+'</p><p>स्थान: '+($('place').value||'—')+'</p><p>Latitude: '+lat+'</p><p>Longitude: '+lon+'</p><p>UTC offset: '+tz+'</p></div><div class="box"><h3>पद्धति</h3><p>Vedic / Sidereal</p><p>Lahiri-style ayanamsha</p><p>External WASM: छैन</p><p class="muted">यो fallback engine हो; professional ephemeris verification अझै आवश्यक छ।</p></div></div>';$('status').className='status';$('status').textContent='✓ कुण्डली गणना सम्पन्न भयो।'}catch(e){$('status').className='status error';$('status').textContent='कुण्डली गणना असफल: '+e.message}})();$('calc').onclick=calc})();
</script></body></html>
