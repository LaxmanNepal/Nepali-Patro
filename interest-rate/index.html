<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="नेपालका बैंकहरूको आजको ब्याजदर — बचत, मुद्दती निक्षेप (FD), recurring deposit र अन्य दरहरू। आधिकारिक बैंक स्रोतबाट दैनिक अपडेट।"><link rel="canonical" href="https://apps.laxmannepal.com.np/Nepali-Patro/interest-rate/"><title>नेपालका बैंकहरूको ब्याजदर | Nepali Patro</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/shared-shell.css"></head><body><div id="sharedHeader"></div><main class="page-shell"><header class="page-hero"><p>नेपाल</p><h1>नेपालका बैंकहरूको ब्याजदर</h1><p>बचत खाता, मुद्दती निक्षेप (FD), recurring deposit र अन्य ब्याजदर। उपलब्ध दरहरू सम्बन्धित बैंकका आधिकारिक स्रोतबाट जाँच गरी दैनिक अपडेट गरिन्छ।</p></header><section class="content-card"><div id="rateStatus">ब्याजदर डेटा लोड हुँदैछ…</div><div id="bankRates"></div></section></main><script src="../js/shared-shell.js?v=20260829-02"></script><script>fetch('../feeds/interest_rates/current.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Interest-rate dataset unavailable');return r.json()}).then(d=>{const banks=(d.banks||[]);document.getElementById('rateStatus').innerHTML='<strong>अन्तिम अपडेट:</strong> '+new Date(d.updatedAt).toLocaleString('ne-NP',{timeZone:'Asia/Kathmandu'});document.getElementById('bankRates').innerHTML=banks.map(b=>'<article class="content-card"><h2>'+escapeHtml(b.bankId)+'</h2><p>स्थिति: '+escapeHtml(b.status)+'</p>'+(b.rates||[]).map(r=>'<div><strong>'+escapeHtml(r.category||'Rate')+'</strong> — '+escapeHtml(String(r.rate??''))+'%</div>').join('')+'</article>').join('')||'<p>हाल प्रमाणित दर उपलब्ध छैन।</p>'}).catch(e=>document.getElementById('rateStatus').textContent='ब्याजदर डेटा अहिले उपलब्ध छैन।');function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
