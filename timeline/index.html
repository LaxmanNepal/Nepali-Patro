<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="महत्वपूर्ण मिति र घटनाहरूलाई व्यक्तिगत टाइमलाइनमा व्यवस्थित गर्नुहोस्।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>मिति टाइमलाइन — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>मिति टाइमलाइन</h1><p>महत्वपूर्ण मिति र घटनाहरूलाई व्यक्तिगत टाइमलाइनमा व्यवस्थित गर्नुहोस्।</p></section><section class="grid"><div class="card"><input id="date" type="date"><input id="event" placeholder="घटना लेख्नुहोस्"><button onclick="add()">थप्नुहोस्</button></div><div class="card"><h2>तपाईंको टाइमलाइन</h2><div id="list" class="list"></div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>let items=JSON.parse(localStorage.npTimeline||'[]');function render(){set('list',items.sort((a,b)=>a.d.localeCompare(b.d)).map(x=>'<div class="item"><b>'+x.d+'</b><br>'+x.e+'</div>').join('')||'<div class="muted">अहिलेसम्म कुनै घटना छैन।</div>')}function add(){let d=date.value,e=event.value.trim();if(!d||!e)return;items.push({d,e});localStorage.npTimeline=JSON.stringify(items);event.value='';render()}render()</script></body></html>
