<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="आगामी पर्व, बिदा र व्यक्तिगत कार्यक्रमहरू एकै ठाउँमा व्यवस्थित गर्नुहोस्।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>पर्व तथा कार्यक्रम — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>पर्व तथा कार्यक्रम</h1><p>आगामी पर्व, बिदा र व्यक्तिगत कार्यक्रमहरू एकै ठाउँमा व्यवस्थित गर्नुहोस्।</p></section><section class="grid"><div class="card"><input id="ed" type="date"><input id="et" placeholder="कार्यक्रम वा पर्व"><button onclick="addEvent()">थप्नुहोस्</button></div><div class="card"><h2>मेरो कार्यक्रम</h2><div id="events" class="list"></div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>let ev=JSON.parse(localStorage.npEvents||'[]');function renderE(){set('events',ev.sort((a,b)=>a.d.localeCompare(b.d)).map(x=>'<div class="item">📅 <b>'+x.d+'</b><br>'+x.t+'</div>').join('')||'<div class="muted">कार्यक्रम थप्नुहोस्।</div>')}function addEvent(){if(!ed.value||!et.value.trim())return;ev.push({d:ed.value,t:et.value.trim()});localStorage.npEvents=JSON.stringify(ev);et.value='';renderE()}renderE()</script></body></html>
