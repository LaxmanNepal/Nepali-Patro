<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="राशि र जन्ममितिका आधारमा व्यक्तिगत दैनिक मार्गदर्शनको सरल पृष्ठ।"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/extra-tools.css"><title>व्यक्तिगत राशिफल — नेपाली पात्रो</title></head><body><header class="top"><a class="brand" href="https://apps.laxmannepal.com.np/Nepali-Patro/">नेपाली पात्रो</a><a class="back" href="https://apps.laxmannepal.com.np/Nepali-Patro/">← गृहपृष्ठ</a></header><main class="wrap"><section class="hero"><h1>व्यक्तिगत राशिफल</h1><p>राशि र जन्ममितिका आधारमा व्यक्तिगत दैनिक मार्गदर्शनको सरल पृष्ठ।</p></section><section class="grid"><div class="card"><label>तपाईंको राशि</label><select id="r"><option>मेष</option><option>वृष</option><option>मिथुन</option><option>कर्कट</option><option>सिंह</option><option>कन्या</option><option>तुला</option><option>वृश्चिक</option><option>धनु</option><option>मकर</option><option>कुम्भ</option><option>मीन</option></select><input id="birth" type="date"><button onclick="read()">आजको मार्गदर्शन</button></div><div class="card"><h2 id="title">राशिफल</h2><div id="out" class="result">राशि चयन गर्नुहोस्।</div></div></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/extra-tools.js"></script><script>const tips=['आज प्राथमिकता स्पष्ट राख्नुहोस् र अधुरा काम पूरा गर्नुहोस्।','सम्बन्धमा स्पष्ट संवादले गलतफहमी कम गर्न सक्छ।','आर्थिक निर्णयमा हतार नगरी तथ्य जाँच्नुहोस्।','नयाँ अवसरमा अघि बढ्नुहोस् तर योजना बनाएर।','आराम र नियमिततामा ध्यान दिनु उपयोगी हुनेछ।'];function read(){let i=(new Date().getDate()+r.selectedIndex)%tips.length;set('title',r.value+' — आजको व्यक्तिगत मार्गदर्शन');set('out',tips[i]+'<br><br><span class="muted">यो मनोरञ्जनात्मक/सामान्य मार्गदर्शन हो, निश्चित भविष्यवाणी होइन।</span>')}</script></body></html>
