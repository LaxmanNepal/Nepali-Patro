<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पूर्ण नेपाली पात्रो</title><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/main.css"><link rel="stylesheet" href="https://apps.laxmannepal.com.np/Nepali-Patro/css/shared-shell.css"><style>.page{max-width:1250px;margin:auto;padding:24px 16px 80px}.hero,.detail,.monthbar{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:24px}.hero p,.monthbar p,.status{color:#666}.toolbar,.nav{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0}.toolbar select,.toolbar button,.nav button{padding:10px 13px;border:1px solid #ddd;border-radius:11px;background:#fff;font:inherit;cursor:pointer}.mode{display:flex;border:1px solid #ddd;border-radius:11px;overflow:hidden}.mode button{border:0;border-radius:0}.mode .active{background:#111;color:#fff}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.monthbar h2{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-head{text-align:center;font-weight:800;padding:10px}.cal-day{min-height:112px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:9px;text-align:left;display:flex;flex-direction:column;cursor:pointer;color:#111;font:inherit}.cal-day:hover,.cal-day.selected{box-shadow:0 5px 18px #0001;border-color:#999}.cal-day.today{outline:2px solid #2563eb;outline-offset:1px}.cal-day.holiday{border-color:#dc2626;background:#fff7f7;color:#991b1b}.cal-day b{font-size:22px}.cal-day small{color:#777}.cal-day span{font-size:11px;color:#555;margin-top:auto}.cal-day em{font-size:10px;font-style:normal;color:#b91c1c;font-weight:700;margin-top:5px}.cal-empty{min-height:112px}.detail{margin-top:16px}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:14px;margin-bottom:14px}.detail-head h2{margin:0 0 5px}.panch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.p-card{border:1px solid #e5e7eb;border-radius:13px;padding:13px;background:#fafafa}.p-card span{display:block;color:#777;font-size:11px;margin-bottom:5px}.p-card b{display:block;line-height:1.5}.event-box{margin-top:13px;padding:13px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa}.detail-actions{margin-top:13px}.detail-actions button{padding:10px 13px;border:1px solid #ddd;background:#fff;border-radius:10px;cursor:pointer}.empty{padding:30px;text-align:center;color:#777;grid-column:1/-1}@media(max-width:650px){.cal-day{min-height:78px;padding:6px}.cal-day b{font-size:17px}.cal-day span{font-size:9px}.cal-day em{display:none}.panch-grid{grid-template-columns:1fr}.hero,.detail,.monthbar{padding:16px}.calendar{gap:3px}.cal-head{font-size:11px;padding:6px}}</style>  <link rel="stylesheet" href="../assets/tools-global.css">
</head><body><main id="app" class="page"><section class="hero"><h1>पूर्ण नेपाली पात्रो</h1><p>बिक्रम संवत् र Gregorian दुवै दृश्य, तिथि तथा विस्तृत पञ्चाङ्ग सहित</p><div class="toolbar"><div class="mode"><button id="bsMode" class="active">बिक्रम संवत्</button><button id="adMode">Gregorian</button></div><select id="year"></select><select id="month"><option value="1">बैशाख</option><option value="2">जेठ</option><option value="3">असार</option><option value="4">साउन</option><option value="5">भदौ</option><option value="6">असोज</option><option value="7">कात्तिक</option><option value="8">मंसिर</option><option value="9">पुष</option><option value="10">माघ</option><option value="11">फागुन</option><option value="12">चैत</option></select><button id="todayBtn">आज / Today</button></div></section><div class="nav"><button id="prevYear">« वर्ष</button><button id="prevMonth">‹ अघिल्लो महिना</button><button id="nextMonth">अर्को महिना ›</button><button id="nextYear">वर्ष »</button></div><section class="monthbar"><div><h2 id="monthTitle">पात्रो</h2><p id="monthSub"></p></div><span id="status" class="status"></span></section><div class="calendar"><div id="weekdays" style="display:contents"></div><div id="grid" style="display:contents"></div></div><section id="calendarDetail" class="detail"></section></main><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/core/data-client.js"></script><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/core/calendar-data.js"></script><script src="https://apps.laxmannepal.com.np/Nepali-Patro/js/core/data-status.js"></script><script src="../assets/tools-global.js" defer></script><script>
(()=>{const BASE='https://apps.laxmannepal.com.np/Nepali-Patro/';const MIN=2040,MAX=2100,months=['बैशाख','जेठ','असार','साउन','भदौ','असोज','कात्तिक','मंसिर','पुष','माघ','फागुन','चैत'],wne=['आइत','सोम','मंगल','बुध','बिही','शुक्र','शनि'],wen=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const np=n=>String(n).replace(/\d/g,d=>'०१२३४५६७८९'[d]),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cache=new Map();async function load(y){if(y<MIN||y>MAX)return null;if(cache.has(y))return cache.get(y);const r=await NPCalendarData.year(y,{bust:false});cache.set(y,r.data);return r.data}const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kathmandu'}).format(new Date());const ad=s=>new Date(s+'T00:00:00Z');const adLabel=s=>new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(ad(s));async function findToday(){const s=today(),y=+s.slice(0,4);for(const by of[y+56,y+57,y+55]){const d=await load(by).catch(()=>null),x=d?.days?.find(v=>v.ad?.date===s);if(x)return x}}function detail(x){const rows=[['वार',x.weekday?.nepali],['तिथि',x.tithi?.name],['पक्ष',x.tithi?.paksha],['तिथि समाप्ति',x.tithi?.end],['नक्षत्र',x.nakshatra?.name],['योग',x.yoga?.name],['करण',x.karana?.name],['राशि',x.rashi],['सूर्योदय',x.sun?.sunrise],['सूर्यास्त',x.sun?.sunset],['चन्द्रोदय',x.moon?.rise],['चन्द्रास्त',x.moon?.set],['राहुकाल',x.rahuKaal?x.rahuKaal.start+' – '+x.rahuKaal.end:'उपलब्ध छैन'],['गुलिककाल',x.gulikaKaal?x.gulikaKaal.start+' – '+x.gulikaKaal.end:'उपलब्ध छैन'],['नेपाल संवत्',x.nepalSambat]];return `<div class="detail-head"><div><h2>${esc(x.bs.display)} — विस्तृत पञ्चाङ्ग</h2><p>${esc(adLabel(x.ad.date))} · ${esc(x.weekday?.nepali||'')}</p></div><strong>${x.holiday?'🇳🇵 सार्वजनिक बिदा':''}</strong></div><div class="panch-grid">${rows.map(r=>`<div class="p-card"><span>${r[0]}</span><b>${esc(r[1]||'उपलब्ध छैन')}</b></div>`).join('')}</div>${x.festival||x.events?.length?`<div class="event-box"><strong>🎉 पर्व / विशेष दिन</strong><p>${esc(x.festival||x.events.join(' · '))}</p></div>`:''}<div class="detail-actions"><button data-p="${x.bs.year}|${x.ad.date}">पूर्ण पञ्चाङ्ग पृष्ठ खोल्नुहोस् →</button></div>`}function card(x,mode,sel){const hol=x.holiday===true||String(x.holiday??'').trim()!=='';return `<button class="cal-day ${hol?'holiday ':''}${x.ad.date===today()?'today ':''}${sel?'selected':''}" data-date="${x.ad.date}"><b>${mode==='bs'?np(x.bs.day):x.ad.day}</b><small>${mode==='bs'?x.ad.day:x.bs.display}</small><span>${esc(x.tithi?.name||'')}</span>${x.festival?`<em>${esc(x.festival)}</em>`:''}</button>`}async function adDays(y,m){let a=[];for(const by of[y+56,y+57,y+55]){const d=await load(by).catch(()=>null);if(d)a.push(...d.days.filter(x=>x.ad?.date?.startsWith(y+'-')))}const seen=new Set();return a.filter(x=>!seen.has(x.ad.date)&&(seen.add(x.ad.date),1)).filter(x=>+x.ad.date.slice(5,7)===m+1).sort((a,b)=>a.ad.date.localeCompare(b.ad.date))}const ys=document.querySelector('#year'),ms=document.querySelector('#month'),grid=document.querySelector('#grid'),det=document.querySelector('#calendarDetail');for(let y=MIN;y<=MAX;y++)ys.insertAdjacentHTML('beforeend',`<option value="${y}">${np(y)}</option>`);let mode='bs',Y=2083,M=1,AY=new Date().getUTCFullYear(),AM=new Date().getUTCMonth(),selected=null;async function render(){document.querySelector('#weekdays').innerHTML=(mode==='bs'?wne:wen).map(x=>`<div class="cal-head">${x}</div>`).join('');let days,title,sub;if(mode==='bs'){const d=await load(Y);days=(d?.days||[]).filter(x=>x.bs.month===M);title=`${months[M-1]} ${np(Y)}`;sub=`${np(days.length)} दिन · ${days[0]?adLabel(days[0].ad.date):''} – ${days.at(-1)?adLabel(days.at(-1).ad.date):''}`}else{days=await adDays(AY,AM);title=`Gregorian ${AY}-${String(AM+1).padStart(2,'0')}`;sub=`${days.length} days`}document.querySelector('#monthTitle').textContent=title;document.querySelector('#monthSub').textContent=sub;document.querySelector('#status').textContent=mode==='bs'?'Bikram Sambat':'Gregorian';const off=days.length?ad(days[0].ad.date).getUTCDay():0;grid.innerHTML=days.length?Array(off).fill('<div class="cal-empty"></div>').join('')+days.map(x=>card(x,mode,selected?.ad.date===x.ad.date)).join(''):'<div class="empty">डेटा उपलब्ध छैन।</div>';grid.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>{selected=days.find(x=>x.ad.date===b.dataset.date);show()});det.innerHTML=selected&&days.some(x=>x.ad.date===selected.ad.date)?detail(selected):`<div class="detail-head"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div></div><p>कुनै पनि मितिमा क्लिक गर्नुहोस्। त्यस दिनको विस्तृत पञ्चाङ्ग यहाँ देखिन्छ।</p>`;bind()}function show(){det.innerHTML=detail(selected);grid.querySelectorAll('.cal-day').forEach(b=>b.classList.toggle('selected',b.dataset.date===selected.ad.date));bind()}function bind(){det.querySelector('[data-p]')?.addEventListener('click',e=>{const[y,d]=e.currentTarget.dataset.p.split('|');location.href=`${BASE}panchanga/?year=${y}&date=${d}`})}async function move(d,t){selected=null;if(mode==='bs'){if(t==='m'){M+=d;if(M<1){M=12;Y--}if(M>12){M=1;Y++}}else Y+=d;Y=Math.max(MIN,Math.min(MAX,Y));ys.value=Y}else{if(t==='m'){AM+=d;if(AM<0){AM=11;AY--}if(AM>11){AM=0;AY++}}else AY+=d}await render()}document.querySelector('#bsMode').onclick=async()=>{mode='bs';bsMode.classList.add('active');adMode.classList.remove('active');await render()};document.querySelector('#adMode').onclick=async()=>{mode='ad';adMode.classList.add('active');bsMode.classList.remove('active');await render()};ys.onchange=async()=>{Y=+ys.value;await render()};ms.onchange=async()=>{M=+ms.value;await render()};prevYear.onclick=()=>move(-1,'y');nextYear.onclick=()=>move(1,'y');prevMonth.onclick=()=>move(-1,'m');nextMonth.onclick=()=>move(1,'m');todayBtn.onclick=async()=>{const x=await findToday();if(!x)return;if(mode==='bs'){Y=x.bs.year;M=x.bs.month;ys.value=Y;ms.value=M}else{const d=ad(x.ad.date);AY=d.getUTCFullYear();AM=d.getUTCMonth()}selected=x;await render();show()};findToday().then(x=>{if(x){selected=x;Y=x.bs.year;M=x.bs.month;ys.value=Y;ms.value=M}return render()}).catch(render)})();
</script></body></html>
